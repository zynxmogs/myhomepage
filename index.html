<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#06070a"
  >

  <meta
    name="description"
    content="A minimal dark personal homepage with time, weather and glass shortcuts."
  >

  <title>Home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      color-scheme: dark;

      --bg: #06070a;
      --text: #f5f6f8;
      --muted: #9ba1ab;
      --soft: #7d838d;

      --blue: 89, 112, 255;
      --purple: 161, 89, 255;
      --cyan: 52, 191, 199;
      --pink: 255, 91, 157;

      --border: rgba(255, 255, 255, 0.09);
      --shadow: 0 18px 55px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background: var(--bg);

      overflow-x: hidden;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================================
       PERFORMANCE-FRIENDLY BACKGROUND
       ========================================================= */

    .background {
      position: fixed;
      inset: 0;
      z-index: -10;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 50% 40%,
          rgba(255, 255, 255, 0.012),
          transparent 52%
        ),
        #06070a;
    }

    /*
      The background intentionally uses a small number of large
      translucent shapes. Only transform/opacity are animated,
      avoiding expensive continuous filter animation.
    */

    .orb {
      position: absolute;

      width: 38vw;
      height: 38vw;

      min-width: 260px;
      min-height: 260px;

      border-radius: 50%;

      pointer-events: none;

      will-change: transform, opacity;

      opacity: 0.62;
    }

    .orb-1 {
      top: -14vw;
      left: -10vw;

      background:
        radial-gradient(
          circle,
          rgba(var(--blue), 0.22) 0%,
          rgba(var(--blue), 0.075) 40%,
          transparent 72%
        );

      animation:
        moveOne 24s ease-in-out infinite alternate,
        pulseOne 10s ease-in-out infinite;
    }

    .orb-2 {
      top: 5vh;
      right: -13vw;

      background:
        radial-gradient(
          circle,
          rgba(var(--purple), 0.19) 0%,
          rgba(var(--purple), 0.06) 40%,
          transparent 72%
        );

      animation:
        moveTwo 28s ease-in-out infinite alternate,
        pulseTwo 12s ease-in-out infinite;
    }

    .orb-3 {
      left: 30%;
      bottom: -26vw;

      background:
        radial-gradient(
          circle,
          rgba(var(--cyan), 0.14) 0%,
          rgba(var(--cyan), 0.045) 40%,
          transparent 72%
        );

      animation:
        moveThree 31s ease-in-out infinite alternate,
        pulseThree 14s ease-in-out infinite;
    }

    .orb-4 {
      right: 9%;
      bottom: 8%;

      width: 280px;
      height: 280px;

      min-width: 0;
      min-height: 0;

      background:
        radial-gradient(
          circle,
          rgba(var(--pink), 0.085) 0%,
          rgba(var(--pink), 0.025) 42%,
          transparent 73%
        );

      animation: moveFour 26s ease-in-out infinite alternate;
    }

    .background::before {
      content: "";

      position: absolute;
      inset: -20%;

      background:
        linear-gradient(
          115deg,
          transparent 20%,
          rgba(74, 102, 255, 0.018) 36%,
          transparent 50%,
          rgba(162, 89, 255, 0.02) 67%,
          transparent 80%
        );

      animation:
        backgroundSweep 30s ease-in-out infinite alternate;

      will-change: transform;
    }

    .vignette {
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          ellipse at center,
          transparent 40%,
          rgba(2, 3, 6, 0.20) 100%
        );
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: -9;

      pointer-events: none;

      opacity: 0.018;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.7'/%3E%3C/svg%3E");
    }

    @keyframes moveOne {
      0% {
        transform: translate3d(0, 0, 0) scale(0.98);
      }

      100% {
        transform: translate3d(9vw, 7vh, 0) scale(1.06);
      }
    }

    @keyframes moveTwo {
      0% {
        transform: translate3d(0, 0, 0) scale(1);
      }

      100% {
        transform: translate3d(-8vw, 8vh, 0) scale(1.07);
      }
    }

    @keyframes moveThree {
      0% {
        transform: translate3d(0, 0, 0) scale(0.98);
      }

      100% {
        transform: translate3d(9vw, -6vh, 0) scale(1.07);
      }
    }

    @keyframes moveFour {
      0% {
        transform: translate3d(0, 0, 0) scale(0.95);
      }

      100% {
        transform: translate3d(-5vw, -4vh, 0) scale(1.05);
      }
    }

    @keyframes pulseOne {
      0%,
      100% {
        opacity: 0.54;
      }

      50% {
        opacity: 0.78;
      }
    }

    @keyframes pulseTwo {
      0%,
      100% {
        opacity: 0.48;
      }

      50% {
        opacity: 0.70;
      }
    }

    @keyframes pulseThree {
      0%,
      100% {
        opacity: 0.42;
      }

      50% {
        opacity: 0.62;
      }
    }

    @keyframes backgroundSweep {
      0% {
        transform: translate3d(-5%, -2%, 0);
      }

      100% {
        transform: translate3d(5%, 3%, 0);
      }
    }

    /* =========================================================
       MAIN LAYOUT
       ========================================================= */

    .shell {
      width:
        min(
          1120px,
          calc(100% - 32px)
        );

      margin: 0 auto;

      padding:
        34px
        0
        36px;
    }

    /* =========================================================
       TOP BAR
       ========================================================= */

    .topbar {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: space-between;

      min-height: 34px;

      margin-bottom: 56px;
    }

    .brand {
      font-size: 13px;
      font-weight: 600;

      letter-spacing: 0.045em;

      color:
        rgba(
          255,
          255,
          255,
          0.76
        );
    }

    /* =========================================================
       WEATHER
       ========================================================= */

    .weather-widget {
      position: absolute;

      top: 0;
      right: 0;

      display: inline-flex;
      align-items: center;

      gap: 8px;

      min-height: 34px;

      padding:
        6px
        9px;

      border:
        1px
        solid
        rgba(
          255,
          255,
          255,
          0.07
        );

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          rgba(80, 103, 255, 0.06),
          rgba(255,255,255,0.025) 55%,
          rgba(163, 88, 255, 0.03)
        );

      box-shadow:
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.035
        );

      backdrop-filter:
        blur(14px);

      -webkit-backdrop-filter:
        blur(14px);

      max-width: 220px;

      transition:
        background 0.25s ease,
        border-color 0.25s ease,
        transform 0.25s ease;
    }

    .weather-widget:hover {
      transform: translateY(-1px);

      border-color:
        rgba(
          135,
          151,
          255,
          0.13
        );

      background:
        linear-gradient(
          135deg,
          rgba(80, 103, 255, 0.075),
          rgba(255,255,255,0.035) 55%,
          rgba(163, 88, 255, 0.04)
        );
    }

    .weather-mini-icon {
      width: 20px;

      flex: 0 0 20px;

      font-size: 17px;

      line-height: 1;

      text-align: center;
    }

    .weather-mini-info {
      min-width: 0;
    }

    .weather-mini-top {
      display: flex;
      align-items: baseline;

      gap: 5px;

      line-height: 1;
    }

    .weather-mini-temp {
      font-size: 13px;
      font-weight: 600;

      letter-spacing: -0.035em;

      font-variant-numeric:
        tabular-nums;
    }

    .weather-mini-condition {
      max-width: 92px;

      font-size: 9px;

      color: var(--muted);

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .weather-mini-location {
      margin-top: 3px;

      font-size: 9px;

      color: var(--soft);

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      cursor: pointer;

      transition:
        color 0.2s ease;
    }

    .weather-mini-location:hover {
      color: #adb3bd;
    }

    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      text-align: center;

      margin:
        0
        auto
        46px;
    }

    .eyebrow {
      min-height: 20px;

      margin-bottom: 12px;

      color: var(--muted);

      font-size: 14px;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .time {
      font-size:
        clamp(
          66px,
          13vw,
          148px
        );

      line-height: 0.9;

      letter-spacing:
        -0.075em;

      font-weight: 600;

      font-variant-numeric:
        tabular-nums;

      margin-left:
        -0.075em;

      text-shadow:
        0
        0
        32px
        rgba(
          92,
          114,
          255,
          0.035
        );
    }

    .date {
      margin-top: 18px;

      color: var(--muted);

      font-size: 15px;

      letter-spacing: 0.01em;
    }

    /* =========================================================
       SEARCH
       ========================================================= */

    .search {
      position: relative;

      width:
        min(
          700px,
          100%
        );

      margin:
        0
        auto;
    }

    .search::before {
      content: "";

      position: absolute;

      inset: -1px;

      z-index: -1;

      border-radius: 20px;

      background:
        linear-gradient(
          110deg,
          #6279ff,
          #8d6cff,
          #c777ff,
          #50cbd4,
          #6279ff
        );

      background-size: 250% 100%;

      opacity: 0;

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;

      animation:
        searchGlow 6s linear infinite;

      will-change:
        background-position;
    }

    .search::after {
      content: "";

      position: absolute;

      left: 10%;
      right: 10%;
      bottom: -13px;

      height: 20px;

      border-radius: 50%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(92, 113, 255, 0.10),
          rgba(173, 91, 255, 0.09),
          rgba(74, 203, 208, 0.07),
          transparent
        );

      opacity: 0;

      filter: blur(12px);

      transition:
        opacity 0.3s ease;
    }

    .search:focus-within::before {
      opacity: 0.85;

      transform:
        scale(1.005);
    }

    .search:focus-within::after {
      opacity: 0.85;
    }

    .search input {
      position: relative;

      width: 100%;
      height: 60px;

      padding:
        0
        55px
        0
        21px;

      border:
        1px
        solid
        rgba(
          255,
          255,
          255,
          0.095
        );

      border-radius: 19px;

      outline: none;

      color: var(--text);

      background:
        linear-gradient(
          135deg,
          rgba(
            86,
            109,
            255,
            0.055
          ),
          rgba(
            255,
            255,
            255,
            0.035
          ) 48%,
          rgba(
            156,
            88,
            255,
            0.035
          )
        );

      box-shadow:
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.04
        ),
        0
        12px
        42px
        rgba(
          0,
          0,
          0,
          0.16
        );

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);

      transition:
        transform 0.28s cubic-bezier(
          0.2,
          0.8,
          0.2,
          1
        ),
        border-color 0.28s ease,
        background 0.28s ease,
        box-shadow 0.28s ease;
    }

    .search input::placeholder {
      color: #777e89;

      transition:
        color 0.2s ease;
    }

    .search input:focus {
      transform:
        translateY(-2px)
        scale(1.006);

      border-color:
        rgba(
          255,
          255,
          255,
          0.16
        );

      background:
        linear-gradient(
          135deg,
          rgba(
            86,
            109,
            255,
            0.075
          ),
          rgba(
            255,
            255,
            255,
            0.045
          ) 48%,
          rgba(
            156,
            88,
            255,
            0.055
          )
        );

      box-shadow:
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.05
        ),
        0
        18px
        54px
        rgba(
          0,
          0,
          0,
          0.2
        ),
        0
        0
        28px
        rgba(
          91,
          113,
          255,
          0.06
        );
    }

    .search input:focus::placeholder {
      color: #9198a3;
    }

    .search-icon {
      position: absolute;

      right: 20px;
      top: 50%;

      width: 20px;
      height: 20px;

      transform:
        translateY(-50%);

      color: #8e949e;

      pointer-events: none;

      transition:
        transform 0.28s
          cubic-bezier(
            0.2,
            0.8,
            0.2,
            1
          ),
        color 0.25s ease;
    }

    .search:focus-within
    .search-icon {
      color: #b3bbff;

      transform:
        translateY(-50%)
        rotate(-7deg)
        scale(1.05);
    }

    @keyframes searchGlow {
      0% {
        background-position:
          0% 50%;
      }

      50% {
        background-position:
          100% 50%;
      }

      100% {
        background-position:
          0% 50%;
      }
    }

    /* =========================================================
       SHORTCUTS
       ========================================================= */

    .shortcuts {
      width:
        min(
          900px,
          100%
        );

      margin:
        24px
        auto
        0;
    }

    .shortcuts-head {
      display: flex;

      align-items: center;
      justify-content: center;

      margin-bottom: 13px;
    }

    .label {
      font-size: 10px;

      font-weight: 600;

      color: #8f96a0;

      text-transform: uppercase;

      letter-spacing:
        0.13em;
    }

    .shortcut-grid {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 10px;
    }

    .shortcut {
      position: relative;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      min-height: 44px;

      padding:
        0
        17px;

      border-radius:
        999px;

      border:
        1px
        solid
        rgba(
          255,
          255,
          255,
          0.08
        );

      background:
        linear-gradient(
          135deg,
          rgba(
            93,
            113,
            255,
            0.065
          ),
          rgba(
            255,
            255,
            255,
            0.032
          ) 50%,
          rgba(
            163,
            90,
            255,
            0.04
          )
        );

      color: #e1e4e9;

      box-shadow:
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.04
        ),
        0
        8px
        24px
        rgba(
          0,
          0,
          0,
          0.14
        );

      backdrop-filter:
        blur(14px);

      -webkit-backdrop-filter:
        blur(14px);

      overflow: hidden;

      transition:
        transform 0.2s
          cubic-bezier(
            0.2,
            0.8,
            0.2,
            1
          ),
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .shortcut::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          110deg,
          rgba(
            95,
            119,
            255,
            0.13
          ),
          transparent 45%,
          rgba(
            173,
            91,
            255,
            0.095
          )
        );

      opacity: 0;

      transition:
        opacity 0.2s ease;

      pointer-events: none;
    }

    .shortcut:hover {
      transform:
        translateY(-2px);

      border-color:
        rgba(
          122,
          141,
          255,
          0.16
        );

      background:
        linear-gradient(
          135deg,
          rgba(
            93,
            113,
            255,
            0.09
          ),
          rgba(
            255,
            255,
            255,
            0.05
          ) 50%,
          rgba(
            163,
            90,
            255,
            0.065
          )
        );

      box-shadow:
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.05
        ),
        0
        12px
        28px
        rgba(
          0,
          0,
          0,
          0.18
        );
    }

    .shortcut:hover::before {
      opacity: 1;
    }

    .shortcut:active {
      transform:
        translateY(0)
        scale(0.97);
    }

    .shortcut svg {
      position: relative;
      z-index: 1;

      flex:
        0
        0
        auto;

      opacity: 0.88;

      transition:
        transform 0.2s
        ease,
        opacity 0.2s
        ease;
    }

    .shortcut:hover svg {
      transform: scale(1.04);
      opacity: 1;
    }

    .shortcut span {
      position: relative;
      z-index: 1;

      font-size: 11px;
      font-weight: 500;

      white-space: nowrap;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      text-align: center;

      color: #5f6670;

      font-size: 10px;

      margin-top: 32px;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {
      .shell {
        width:
          min(
            100% - 20px,
            1120px
          );

        padding-top: 20px;
      }

      .topbar {
        margin-bottom: 42px;
      }

      .weather-widget {
        top: -3px;
        right: 0;

        max-width: 170px;
      }

      .hero {
        margin-bottom: 40px;
      }

      .time {
        font-size:
          clamp(
            58px,
            18vw,
            92px
          );
      }

      .date {
        font-size: 13px;
      }

      .shortcuts {
        margin-top: 22px;
      }

      .shortcut {
        min-height: 42px;

        padding:
          0
          15px;
      }

      .shortcut span {
        font-size: 11px;
      }

      .orb {
        width: 300px;
        height: 300px;
      }

      .orb-1 {
        left: -145px;
        top: -75px;
      }

      .orb-2 {
        right: -145px;
        top: 100px;
      }

      .orb-3 {
        left: 2%;
        bottom: -200px;
      }

      .orb-4 {
        width: 220px;
        height: 220px;

        right: -55px;
        bottom: 9%;
      }
    }

    @media (max-width: 430px) {
      .weather-widget {
        max-width: 156px;

        padding:
          6px
          8px;
      }

      .weather-mini-condition {
        max-width: 68px;
      }

      .time {
        font-size:
          clamp(
            54px,
            18vw,
            82px
          );
      }

      .search input {
        height: 57px;
      }

      .shortcut-grid {
        gap: 8px;
      }

      .shortcut {
        padding:
          0
          13px;
      }
    }

    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       BACKGROUND
       ========================================================= -->

  <div
    class="background"
    aria-hidden="true"
  >
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>

    <div class="vignette"></div>
  </div>

  <div
    class="grain"
    aria-hidden="true"
  ></div>

  <main class="shell">

    <!-- =======================================================
         TOP BAR
         ======================================================= -->

    <header class="topbar">

      <div class="brand">
        HOME
      </div>

      <!-- Weather -->
      <div
        class="weather-widget"
        aria-label="Current weather"
      >

        <div
          class="weather-mini-icon"
          id="weatherIcon"
          aria-hidden="true"
        >
          —
        </div>

        <div class="weather-mini-info">

          <div class="weather-mini-top">

            <div
              class="weather-mini-temp"
              id="temperature"
            >
              --°
            </div>

            <div
              class="weather-mini-condition"

  <script>
    "use strict";

    /* =========================================================
       HELPER
       ========================================================= */

    const $ = (id) =>
      document.getElementById(id);

    /* =========================================================
       WEATHER CODES
       ========================================================= */

    const WEATHER_CODES = {
      0: ["Clear sky", "☀️"],
      1: ["Mainly clear", "🌤️"],
      2: ["Partly cloudy", "⛅"],
      3: ["Overcast", "☁️"],

      45: ["Fog", "🌫️"],
      48: ["Rime fog", "🌫️"],

      51: ["Light drizzle", "🌦️"],
      53: ["Drizzle", "🌦️"],
      55: ["Heavy drizzle", "🌧️"],

      56: ["Freezing drizzle", "🌧️"],
      57: ["Heavy freezing drizzle", "🌧️"],

      61: ["Light rain", "🌦️"],
      63: ["Rain", "🌧️"],
      65: ["Heavy rain", "🌧️"],

      66: ["Freezing rain", "🌧️"],
      67: ["Heavy freezing rain", "🌧️"],

      71: ["Light snow", "🌨️"],
      73: ["Snow", "❄️"],
      75: ["Heavy snow", "❄️"],
      77: ["Snow grains", "❄️"],

      80: ["Light showers", "🌦️"],
      81: ["Showers", "🌧️"],
      82: ["Heavy showers", "⛈️"],

      85: ["Snow showers", "🌨️"],
      86: ["Heavy snow showers", "🌨️"],

      95: ["Thunderstorm", "⛈️"],
      96: ["Thunderstorm + hail", "⛈️"],
      99: ["Thunderstorm + hail", "⛈️"]
    };

    /* =========================================================
       GREETINGS
       ========================================================= */

    const GREETINGS = {
      night: [
        "Still up?",
        "Late-night mode.",
        "Good night.",
        "The world is quiet.",
        "Burning the midnight oil?",
        "One more thing before bed?"
      ],

      earlyMorning: [
        "Good morning.",
        "Morning.",
        "Rise and shine.",
        "A fresh start.",
        "New day, new start.",
        "Good morning, Zynx."
      ],

      morning: [
        "Good morning.",
        "Hope your morning is going well.",
        "Morning, Zynx.",
        "Ready for the day?",
        "Hope you're having a good start.",
        "A good morning to you."
      ],

      midday: [
        "Almost noon.",
        "Good afternoon.",
        "Midday already.",
        "Halfway through the day.",
        "How's your day going?",
        "Hope the day is going well."
      ],

      afternoon: [
        "Good afternoon.",
        "How's your afternoon?",
        "Hope your day is going well.",
        "Afternoon.",
        "Still plenty of day left.",
        "Hope you're having a good one."
      ],

      evening: [
        "Good evening.",
        "Evening.",
        "Hope you had a good day.",
        "A quiet evening.",
        "Time to slow down.",
        "Good to see you."
      ],

      lateEvening: [
        "Good evening.",
        "Winding down?",
        "Late evening.",
        "Still going strong?",
        "A calm night ahead.",
        "Almost time to call it a day."
      ]
    };

    function getGreeting(hour) {
      if (hour < 5) {
        return GREETINGS.night;
      }

      if (hour < 9) {
        return GREETINGS.earlyMorning;
      }

      if (hour < 12) {
        return GREETINGS.morning;
      }

      if (hour < 14) {
        return GREETINGS.midday;
      }

      if (hour < 18) {
        return GREETINGS.afternoon;
      }

      if (hour < 21) {
        return GREETINGS.evening;
      }

      return GREETINGS.lateEvening;
    }

    /* =========================================================
       CLOCK
       ========================================================= */

    function updateClock() {
      const now =
        new Date();

      const timeString =
        now.toLocaleTimeString(
          [],
          {
            hour: "numeric",
            minute: "2-digit",
            hour12: true
          }
        );

      const dateString =
        now.toLocaleDateString(
          [],
          {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        );

      const greetings =
        getGreeting(
          now.getHours()
        );

      const greetingIndex =
        (
          now.getDate() +
          now.getMonth() +
          now.getDay()
        ) % greetings.length;

      $("time").textContent =
        timeString;

      $("date").textContent =
        dateString;

      $("greeting").textContent =
        greetings[greetingIndex];

      document.title =
        `${timeString} · Home`;
    }

    updateClock();

    setInterval(
      updateClock,
      1000
    );

    /* =========================================================
       SEARCH
       ========================================================= */

    $("searchForm")
      .addEventListener(
        "submit",
        (event) => {
          event.preventDefault();

          const query =
            $("searchInput")
              .value
              .trim();

          if (!query) {
            return;
          }

          window.location.href =
            "https://www.google.com/search?q=" +
            encodeURIComponent(query);
        }
      );

    /* =========================================================
       REVERSE GEOCODING
       ========================================================= */

    async function reverseGeocode(
      latitude,
      longitude
    ) {
      const url =
        "https://api.bigdatacloud.net/data/reverse-geocode-client" +
        `?latitude=${encodeURIComponent(latitude)}` +
        `&longitude=${encodeURIComponent(longitude)}` +
        "&localityLanguage=en";

      try {
        const response =
          await fetch(url);

        if (!response.ok) {
          throw new Error(
            "Reverse geocoding failed."
          );
        }

        const data =
          await response.json();

        const name =
          data?.city ||
          data?.locality ||
          data?.principalSubdivision ||
          null;

        if (!name) {
          return null;
        }

        return {
          name,
          country:
            data?.countryName || ""
        };
      } catch {
        return null;
      }
    }

    /* =========================================================
       WEATHER API
       ========================================================= */

    async function fetchWeather(
      latitude,
      longitude
    ) {
      const params =
        new URLSearchParams({
          latitude,
          longitude,

          current:
            "temperature_2m," +
            "relative_humidity_2m," +
            "apparent_temperature," +
            "weather_code," +
            "wind_speed_10m",

          timezone:
            "auto",

          temperature_unit:
            "celsius",

          wind_speed_unit:
            "kmh"
        });

      const response =
        await fetch(
          "https://api.open-meteo.com/v1/forecast?" +
          params.toString()
        );

      if (!response.ok) {
        throw new Error(
          "Weather request failed."
        );
      }

      return response.json();
    }

    /* =========================================================
       RENDER WEATHER
       ========================================================= */

    function renderWeather(
      data,
      place
    ) {
      if (
        !data ||
        !data.current
      ) {
        throw new Error(
          "Invalid weather data."
        );
      }

      const current =
        data.current;

      const code =
        Number(
          current.weather_code
        );

      const info =
        WEATHER_CODES[code] ||
        ["Weather", "•"];

      $("weatherIcon")
        .textContent =
          info[1];

      $("temperature")
        .textContent =
          `${Math.round(
            Number(
              current.temperature_2m
            )
          )}°`;

      $("condition")
        .textContent =
          info[0];

      $("location")
        .textContent =
          place
            ? `${place.name}${
                place.country
                  ? `, ${place.country}`
                  : ""
              }`
            : "Your location";
    }

    /* =========================================================
       WEATHER FROM COORDINATES
       ========================================================= */

    async function loadWeatherFromCoordinates(
      latitude,
      longitude,
      knownPlace = null
    ) {
      const [
        weather,
        place
      ] =
        await Promise.all([
          fetchWeather(
            latitude,
            longitude
          ),

          knownPlace
            ? Promise.resolve(
                knownPlace
              )
            : reverseGeocode(
                latitude,
                longitude
              )
        ]);

      renderWeather(
        weather,
        place
      );

      try {
        localStorage.setItem(
          "homeLocation",
          JSON.stringify({
            latitude,
            longitude,
            place
          })
        );
      } catch {
        // Storage is optional.
      }
    }

    /* =========================================================
       CURRENT LOCATION
       ========================================================= */

    async function loadWeather() {
      if (
        !("geolocation" in navigator)
      ) {
        throw new Error(
          "Geolocation unavailable."
        );
      }

      const position =
        await new Promise(
          (
            resolve,
            reject
          ) => {
            navigator.geolocation
              .getCurrentPosition(
                resolve,
                reject,
                {
                  enableHighAccuracy:
                    false,

                  timeout:
                    10000,

                  maximumAge:
                    900000
                }
              );
          }
        );

      const latitude =
        Number(
          position.coords.latitude
        );

      const longitude =
        Number(
          position.coords.longitude
        );

      await loadWeatherFromCoordinates(
        latitude,
        longitude
      );
    }

    /* =========================================================
       SAVED LOCATION
       ========================================================= */

    async function loadSavedWeather() {
      let saved = null;

      try {
        saved =
          localStorage.getItem(
            "homeLocation"
          );
      } catch {
        return false;
      }

      if (!saved) {
        return false;
      }

      try {
        const location =
          JSON.parse(saved);

        if (
          typeof location?.latitude !==
            "number" ||
          typeof location?.longitude !==
            "number"
        ) {
          return false;
        }

        await loadWeatherFromCoordinates(
          location.latitude,
          location.longitude,
          location.place || null
        );

        return true;
      } catch {
        return false;
      }
    }

    /* =========================================================
       START WEATHER
       ========================================================= */

    async function startWeather() {
      const restored =
        await loadSavedWeather();

      if (restored) {
        return;
      }

      try {
        await loadWeather();
      } catch {
        $("location")
          .textContent =
            "Tap to enable location";

        $("condition")
          .textContent =
            "Location required";
      }
    }

    /* =========================================================
       REFRESH WEATHER
       ========================================================= */

    $("location")
      .addEventListener(
        "click",
        async () => {
          const previous =
            $("location")
              .textContent;

          $("location")
            .textContent =
              "Refreshing…";

          try {
            await loadWeather();
          } catch {
            $("location")
              .textContent =
                previous ||
                "Location unavailable";
          }
        }
      );

    startWeather();
  </script>
