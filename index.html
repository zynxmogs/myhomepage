<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#06070a"
  >

  <meta
    name="description"
    content="A minimal dark personal homepage with time, weather and glass shortcuts."
  >

  <title>Home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      color-scheme: dark;

      --bg: #06070a;
      --text: #f5f6f8;
      --muted: #9ba1ab;
      --soft: #7d838d;

      --blue: 93, 117, 255;
      --purple: 163, 93, 255;
      --cyan: 55, 194, 202;
      --pink: 255, 91, 157;

      --border: rgba(255, 255, 255, 0.09);

      --glass:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.065),
          rgba(255, 255, 255, 0.025)
        );

      --shadow:
        0 22px 70px rgba(0, 0, 0, 0.38);

      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(72, 84, 150, 0.045),
          transparent 34%
        ),
        var(--bg);

      overflow-x: hidden;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================================
       BACKGROUND
       ========================================================= */

    .background {
      position: fixed;
      inset: 0;
      z-index: -10;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(255, 255, 255, 0.012),
          transparent 60%
        );
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;

      filter: blur(85px);

      will-change:
        transform,
        opacity;

      transform:
        translate3d(0, 0, 0);
    }

    .orb-1 {
      width: 430px;
      height: 430px;

      left: -130px;
      top: -110px;

      background:
        radial-gradient(
          circle,
          rgba(var(--blue), 0.25) 0%,
          rgba(var(--blue), 0.09) 36%,
          transparent 73%
        );

      animation:
        floatOne 18s ease-in-out infinite alternate,
        glowOne 9s ease-in-out infinite;
    }

    .orb-2 {
      width: 390px;
      height: 390px;

      right: -130px;
      top: 90px;

      background:
        radial-gradient(
          circle,
          rgba(var(--purple), 0.22) 0%,
          rgba(var(--purple), 0.07) 39%,
          transparent 73%
        );

      animation:
        floatTwo 22s ease-in-out infinite alternate,
        glowTwo 11s ease-in-out infinite;
    }

    .orb-3 {
      width: 420px;
      height: 420px;

      left: 23%;
      bottom: -270px;

      background:
        radial-gradient(
          circle,
          rgba(var(--cyan), 0.17) 0%,
          rgba(var(--cyan), 0.05) 41%,
          transparent 73%
        );

      animation:
        floatThree 26s ease-in-out infinite alternate,
        glowThree 13s ease-in-out infinite;
    }

    .orb-4 {
      width: 290px;
      height: 290px;

      right: 11%;
      bottom: 8%;

      background:
        radial-gradient(
          circle,
          rgba(var(--pink), 0.11) 0%,
          rgba(var(--pink), 0.035) 42%,
          transparent 75%
        );

      animation:
        floatFour 21s ease-in-out infinite alternate;
    }

    .orb-5 {
      width: 280px;
      height: 280px;

      left: 40%;
      top: 28%;

      background:
        radial-gradient(
          circle,
          rgba(90, 113, 255, 0.075) 0%,
          rgba(90, 113, 255, 0.02) 46%,
          transparent 76%
        );

      animation:
        floatFive 28s ease-in-out infinite alternate;
    }

    .color-wash {
      position: absolute;
      inset: -30%;

      background:
        conic-gradient(
          from 0deg at 50% 50%,
          rgba(66, 101, 255, 0.025),
          rgba(157, 85, 255, 0.035),
          rgba(49, 193, 202, 0.024),
          rgba(255, 86, 153, 0.018),
          rgba(66, 101, 255, 0.025)
        );

      filter: blur(75px);

      animation:
        slowRotate 42s linear infinite;
    }

    .vignette {
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          ellipse at center,
          transparent 30%,
          rgba(2, 3, 6, 0.2) 100%
        );
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: -9;
      pointer-events: none;

      opacity: 0.024;

      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.8'/%3E%3C/svg%3E");
    }

    @keyframes floatOne {
      0% {
        transform:
          translate3d(-15px, -10px, 0)
          scale(0.96);
      }

      50% {
        transform:
          translate3d(55px, 35px, 0)
          scale(1.08);
      }

      100% {
        transform:
          translate3d(100px, 125px, 0)
          scale(1.02);
      }
    }

    @keyframes floatTwo {
      0% {
        transform:
          translate3d(20px, -10px, 0)
          scale(1);
      }

      50% {
        transform:
          translate3d(-55px, 50px, 0)
          scale(1.1);
      }

      100% {
        transform:
          translate3d(-110px, 135px, 0)
          scale(0.98);
      }
    }

    @keyframes floatThree {
      0% {
        transform:
          translate3d(-55px, 15px, 0)
          scale(0.97);
      }

      50% {
        transform:
          translate3d(35px, -65px, 0)
          scale(1.09);
      }

      100% {
        transform:
          translate3d(155px, 40px, 0)
          scale(1.02);
      }
    }

    @keyframes floatFour {
      0% {
        transform:
          translate3d(0, 0, 0)
          scale(0.94);
      }

      50% {
        transform:
          translate3d(-70px, -40px, 0)
          scale(1.08);
      }

      100% {
        transform:
          translate3d(45px, 60px, 0)
          scale(0.99);
      }
    }

    @keyframes floatFive {
      0% {
        transform:
          translate3d(-30px, 25px, 0)
          scale(0.92);
      }

      50% {
        transform:
          translate3d(50px, -35px, 0)
          scale(1.1);
      }

      100% {
        transform:
          translate3d(90px, 65px, 0)
          scale(1);
      }
    }

    @keyframes glowOne {
      0%,
      100% {
        opacity: 0.66;
      }

      50% {
        opacity: 1;
      }
    }

    @keyframes glowTwo {
      0%,
      100% {
        opacity: 0.62;
      }

      50% {
        opacity: 0.94;
      }
    }

    @keyframes glowThree {
      0%,
      100% {
        opacity: 0.56;
      }

      50% {
        opacity: 0.86;
      }
    }

    @keyframes slowRotate {
      from {
        transform: rotate(0deg) scale(1);
      }

      to {
        transform: rotate(360deg) scale(1.08);
      }
    }

    /* =========================================================
       LAYOUT
       ========================================================= */

    .shell {
      width: min(
        1120px,
        calc(100% - 32px)
      );

      margin: 0 auto;

      padding:
        34px
        0
        36px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: flex-start;

      margin-bottom: 58px;
    }

    .brand {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.045em;

      color:
        rgba(
          255,
          255,
          255,
          0.76
        );
    }

    /* =========================================================
       WEATHER TOP RIGHT
       ========================================================= */

    .weather-widget {
      position: absolute;

      top: 25px;
      right: 0;

      display: inline-flex;
      align-items: center;

      gap: 8px;

      padding:
        8px
        10px;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.07
        );

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          rgba(
            86,
            111,
            255,
            0.075
          ),
          rgba(
            255,
            255,
            255,
            0.028
          )
        );

      box-shadow:
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.04
        );

      backdrop-filter:
        blur(20px)
        saturate(125%);

      -webkit-backdrop-filter:
        blur(20px)
        saturate(125%);

      max-width: 210px;
    }

    .weather-mini-icon {
      width: 22px;
      flex: 0 0 22px;

      font-size: 19px;
      line-height: 1;
      text-align: center;
    }

    .weather-mini-info {
      min-width: 0;
    }

    .weather-mini-top {
      display: flex;
      align-items: baseline;
      gap: 5px;
    }

    .weather-mini-temp {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.035em;

      font-variant-numeric:
        tabular-nums;
    }

    .weather-mini-condition {
      font-size: 9px;
      color: var(--muted);

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 105px;
    }

    .weather-mini-location {
      margin-top: 1px;

      font-size: 9px;
      color: var(--soft);

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      cursor: pointer;
    }

    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      position: relative;

      text-align: center;

      margin:
        0
        auto
        48px;
    }

    .eyebrow {
      min-height: 20px;

      margin-bottom: 12px;

      color: var(--muted);

      font-size: 14px;

      transition:
        opacity
        0.25s
        ease;
    }

    .time {
      font-size:
        clamp(
          66px,
          13vw,
          148px
        );

      line-height: 0.9;

      letter-spacing:
        -0.075em;

      font-weight: 600;

      font-variant-numeric:
        tabular-nums;

      margin-left:
        -0.075em;

      text-shadow:
        0
        0
        36px
        rgba(
          91,
          114,
          255,
          0.04
        );
    }

    .date {
      margin-top: 18px;

      color: var(--muted);

      font-size: 15px;
      letter-spacing: 0.01em;
    }

    /* =========================================================
       SEARCH
       ========================================================= */

    .search {
      width: min(
        700px,
        100%
      );

      margin: 0 auto;

      position: relative;
    }

    .search::before {
      content: "";

      position: absolute;

      left: 15%;
      right: 15%;
      bottom: -16px;

      height: 22px;

      background:
        radial-gradient(
          ellipse,
          rgba(
            79,
            104,
            255,
            0.08
          ),
          transparent 72%
        );

      filter: blur(18px);

      pointer-events: none;
    }

    .search input {
      width: 100%;

      height: 60px;

      padding:
        0
        55px
        0
        21px;

      border:
        1px
        solid
        rgba(
          255,
          255,
          255,
          0.10
        );

      border-radius: 19px;

      outline: none;

      color: var(--text);

      background:
        linear-gradient(
          135deg,
          rgba(
            91,
            114,
            255,
            0.065
          ),
          rgba(
            255,
            255,
            255,
            0.035
          ) 48%,
          rgba(
            162,
            91,
            255,
            0.04
          )
        );

      box-shadow:
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.045
        ),
        0
        15px
        50px
        rgba(
          0,
          0,
          0,
          0.18
        );

      backdrop-filter:
        blur(22px)
        saturate(135%);

      -webkit-backdrop-filter:
        blur(22px)
        saturate(135%);

      transition:
        border-color
        0.22s
        ease,
        background
        0.22s
        ease,
        box-shadow
        0.22s
        ease,
        transform
        0.22s
        ease;
    }

    .search input::placeholder {
      color: #777e89;
    }

    .search input:focus {
      transform: translateY(-1px);

      border-color:
        rgba(
          113,
          132,
          255,
          0.25
        );

      background:
        linear-gradient(
          135deg,
          rgba(
            91,
            114,
            255,
            0.085
          ),
          rgba(
            255,
            255,
            255,
            0.05
          ) 48%,
          rgba(
            162,
            91,
            255,
            0.06
          )
        );

      box-shadow:
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.05
        ),
        0
        18px
        55px
        rgba(
          0,
          0,
          0,
          0.22
        ),
        0
        0
        30px
        rgba(
          76,
          104,
          255,
          0.06
        );
    }

    .search-icon {
      position: absolute;

      right: 20px;
      top: 50%;

      transform:
        translateY(-50%);

      color: #8e949e;

      pointer-events: none;
    }

    /* =========================================================
       SHORTCUTS
       ========================================================= */

    .shortcuts {
      width: min(
        900px,
        100%
      );

      margin:
        24px
        auto
        0;
    }

    .shortcuts-head {
      display: flex;
      align-items: center;

      justify-content: center;

      margin-bottom: 13px;
    }

    .label {
      font-size: 10px;
      font-weight: 600;

      color: #8f96a0;

      text-transform: uppercase;

      letter-spacing: 0.13em;
    }

    .shortcut-grid {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 10px;
    }

    .shortcut {
      position: relative;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      min-height: 44px;

      padding:
        0
        17px;

      border-radius: 999px;

      border:
        1px
        solid
        rgba(
          255,
          255,
          255,
          0.085
        );

      background:
        linear-gradient(
          135deg,
          rgba(
            101,
            122,
            255,
            0.075
          ),
          rgba(
            255,
            255,
            255,
            0.035
          ) 48%,
          rgba(
            168,
            91,
            255,
            0.045
          )
        );

      color: #e1e4e9;

      box-shadow:
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.045
        ),
        0
        9px
        26px
        rgba(
          0,
          0,
          0,
          0.15
        );

      backdrop-filter:
        blur(18px)
        saturate(130%);

      -webkit-backdrop-filter:
        blur(18px)
        saturate(130%);

      overflow: hidden;

      transition:
        transform
        0.18s
        ease,
        border-color
        0.18s
        ease,
        background
        0.18s
        ease,
        box-shadow
        0.18s
        ease;
    }

    .shortcut::before {
      content: "";

      position: absolute;

      inset: 0;

      opacity: 0;

      background:
        linear-gradient(
          100deg,
          rgba(
            96,
            120,
            255,
            0.15
          ),
          transparent 42%,
          rgba(
            173,
            91,
            255,
            0.11
          )
        );

      transition:
        opacity
        0.18s
        ease;

      pointer-events: none;
    }

    .shortcut:hover {
      transform:
        translateY(-2px);

      border-color:
        rgba(
          120,
          140,
          255,
          0.18
        );

      background:
        linear-gradient(
          135deg,
          rgba(
            101,
            122,
            255,
            0.10
          ),
          rgba(
            255,
            255,
            255,
            0.055
          ) 48%,
          rgba(
            168,
            91,
            255,
            0.075
          )
        );

      box-shadow:
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.06
        ),
        0
        12px
        30px
        rgba(
          0,
          0,
          0,
          0.2
        ),
        0
        0
        28px
        rgba(
          89,
          114,
          255,
          0.04
        );
    }

    .shortcut:hover::before {
      opacity: 1;
    }

    .shortcut:active {
      transform:
        scale(0.97);
    }

    .shortcut svg {
      position: relative;
      z-index: 1;

      flex: 0 0 auto;

      opacity: 0.87;
    }

    .shortcut span {
      position: relative;
      z-index: 1;

      font-size: 11px;
      font-weight: 500;

      white-space: nowrap;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      text-align: center;

      color: #5f6670;

      font-size: 10px;

      margin-top: 32px;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {
      .weather-widget {
        top: 17px;
        right: 10px;
      }

      .shell {
        width:
          min(
            100% - 20px,
            1120px
          );

        padding-top: 20px;
      }

      .topbar {
        margin-bottom: 42px;
      }

      .hero {
        margin-bottom: 40px;
      }

      .time {
        font-size:
          clamp(
            58px,
            18vw,
            92px
          );
      }

      .date {
        font-size: 13px;
      }

      .shortcuts {
        margin-top: 22px;
      }

      .shortcut {
        min-height: 42px;
        padding: 0 15px;
      }

      .shortcut span {
        font-size: 11px;
      }

      .orb-1 {
        width: 340px;
        height: 340px;

        left: -160px;
        top: -80px;
      }

      .orb-2 {
        width: 330px;
        height: 330px;

        right: -160px;
        top: 100px;
      }

      .orb-3 {
        width: 350px;
        height: 350px;

        left: 4%;
        bottom: -220px;
      }

      .orb-4 {
        width: 250px;
        height: 250px;

        right: -60px;
        bottom: 8%;
      }

      .orb-5 {
        width: 240px;
        height: 240px;

        left: 28%;
        top: 38%;
      }
    }

    @media (max-width: 430px) {
      .weather-widget {
        max-width: 160px;
        padding: 7px 9px;
      }

      .weather-mini-condition {
        max-width: 72px;
      }

      .time {
        font-size:
          clamp(
            54px,
            18vw,
            82px
          );
      }

      .search input {
        height: 57px;
      }

      .shortcut-grid {
        gap: 8px;
      }

      .shortcut {
        padding: 0 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       BACKGROUND
       ========================================================= -->

  <div
    class="background"
    aria-hidden="true"
  >
    <div class="color-wash"></div>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="orb orb-5"></div>

    <div class="vignette"></div>
  </div>

  <div
    class="grain"
    aria-hidden="true"
  ></div>

  <main class="shell">

    <!-- =======================================================
         TOP
         ======================================================= -->

    <header class="topbar">
      <div class="brand">
        HOME
      </div>
    </header>

    <!-- =======================================================
         HERO
         ======================================================= -->

    <section
      class="hero"
      aria-label="Welcome"
    >

      <div
        class="eyebrow"
        id="greeting"
      >
        Welcome.
      </div>

      <div
        class="time"
        id="time"
      >
        --:--
      </div>

      <div
        class="date"
        id="date"
      >
        Loading date…
      </div>

      <!-- ===============================================
           MINIMAL WEATHER
           =============================================== -->

      <div
        class="weather-widget"
        id="weatherWidget"
        aria-label="Current weather"
      >

        <div
          class="weather-mini-icon"
          id="weatherIcon"
          aria-hidden="true"
        >
          —
        </div>

        <div class="weather-mini-info">

          <div class="weather-mini-top">

            <div
              class="weather-mini-temp"
              id="temperature"
            >
              --°
            </div>

            <div
              class="weather-mini-condition"
              id="condition"
            >
              Loading…
            </div>

          </div>

          <div
            class="weather-mini-location"
            id="location"
            title="Tap to refresh location"
          >
            Detecting location…
          </div>

  <script>
    "use strict";

    /* =========================================================
       HELPERS
       ========================================================= */

    const $ = (id) =>
      document.getElementById(id);

    /* =========================================================
       WEATHER CODES
       ========================================================= */

    const WEATHER_CODES = {
      0: ["Clear sky", "☀️"],
      1: ["Mainly clear", "🌤️"],
      2: ["Partly cloudy", "⛅"],
      3: ["Overcast", "☁️"],

      45: ["Fog", "🌫️"],
      48: ["Rime fog", "🌫️"],

      51: ["Light drizzle", "🌦️"],
      53: ["Drizzle", "🌦️"],
      55: ["Heavy drizzle", "🌧️"],

      56: ["Freezing drizzle", "🌧️"],
      57: ["Heavy freezing drizzle", "🌧️"],

      61: ["Light rain", "🌦️"],
      63: ["Rain", "🌧️"],
      65: ["Heavy rain", "🌧️"],

      66: ["Freezing rain", "🌧️"],
      67: ["Heavy freezing rain", "🌧️"],

      71: ["Light snow", "🌨️"],
      73: ["Snow", "❄️"],
      75: ["Heavy snow", "❄️"],
      77: ["Snow grains", "❄️"],

      80: ["Light showers", "🌦️"],
      81: ["Showers", "🌧️"],
      82: ["Heavy showers", "⛈️"],

      85: ["Snow showers", "🌨️"],
      86: ["Heavy snow showers", "🌨️"],

      95: ["Thunderstorm", "⛈️"],
      96: ["Thunderstorm + hail", "⛈️"],
      99: ["Thunderstorm + hail", "⛈️"]
    };

    /* =========================================================
       GREETINGS
       ========================================================= */

    const GREETINGS = {
      night: [
        "Still up?",
        "Late-night mode.",
        "Good night.",
        "Burning the midnight oil?",
        "The world is quiet.",
        "One more thing before bed?"
      ],

      earlyMorning: [
        "Good morning.",
        "Morning.",
        "Rise and shine.",
        "A fresh start.",
        "New day, new start.",
        "Good morning, Zynx."
      ],

      morning: [
        "Good morning.",
        "Hope your morning is going well.",
        "Morning, Zynx.",
        "A good morning to you.",
        "Ready for the day?",
        "Hope you're having a good start."
      ],

      midday: [
        "Almost noon.",
        "Good afternoon.",
        "Midday already.",
        "Hope the day is going well.",
        "Halfway through the day.",
        "How's your day going?"
      ],

      afternoon: [
        "Good afternoon.",
        "How's your afternoon?",
        "Hope your day is going well.",
        "Afternoon.",
        "Still plenty of day left.",
        "Hope you're having a good one."
      ],

      evening: [
        "Good evening.",
        "Evening.",
        "Hope you had a good day.",
        "A quiet evening.",
        "Time to slow down.",
        "Good to see you."
      ],

      lateEvening: [
        "Good evening.",
        "Winding down?",
        "Late evening.",
        "Still going strong?",
        "A calm night ahead.",
        "Almost time to call it a day."
      ]
    };

    function getGreeting(hour) {
      if (hour < 5) {
        return GREETINGS.night;
      }

      if (hour < 9) {
        return GREETINGS.earlyMorning;
      }

      if (hour < 12) {
        return GREETINGS.morning;
      }

      if (hour < 14) {
        return GREETINGS.midday;
      }

      if (hour < 18) {
        return GREETINGS.afternoon;
      }

      if (hour < 21) {
        return GREETINGS.evening;
      }

      return GREETINGS.lateEvening;
    }

    /* =========================================================
       CLOCK
       ========================================================= */

    function updateClock() {
      const now =
        new Date();

      const timeString =
        now.toLocaleTimeString(
          [],
          {
            hour: "numeric",
            minute: "2-digit",
            hour12: true
          }
        );

      const dateString =
        now.toLocaleDateString(
          [],
          {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        );

      const greetings =
        getGreeting(
          now.getHours()
        );

      const greetingIndex =
        (
          now.getDate() +
          now.getMonth() +
          now.getDay()
        ) % greetings.length;

      $("time").textContent =
        timeString;

      $("date").textContent =
        dateString;

      $("greeting").textContent =
        greetings[greetingIndex];

      document.title =
        `${timeString} · Home`;
    }

    updateClock();

    setInterval(
      updateClock,
      1000
    );

    /* =========================================================
       SEARCH
       ========================================================= */

    $("searchForm")
      .addEventListener(
        "submit",
        (event) => {
          event.preventDefault();

          const query =
            $("searchInput")
              .value
              .trim();

          if (!query) {
            return;
          }

          window.location.href =
            "https://www.google.com/search?q=" +
            encodeURIComponent(query);
        }
      );

    /* =========================================================
       REVERSE GEOCODING
       ========================================================= */

    async function reverseGeocode(
      latitude,
      longitude
    ) {
      const url =
        "https://api.bigdatacloud.net/data/reverse-geocode-client" +
        `?latitude=${encodeURIComponent(latitude)}` +
        `&longitude=${encodeURIComponent(longitude)}` +
        "&localityLanguage=en";

      try {
        const response =
          await fetch(url);

        if (!response.ok) {
          throw new Error(
            "Reverse geocoding failed."
          );
        }

        const data =
          await response.json();

        const name =
          data?.city ||
          data?.locality ||
          data?.principalSubdivision ||
          null;

        if (!name) {
          return null;
        }

        return {
          name,
          country:
            data?.countryName || ""
        };
      } catch {
        return null;
      }
    }

    /* =========================================================
       WEATHER API
       ========================================================= */

    async function fetchWeather(
      latitude,
      longitude
    ) {
      const params =
        new URLSearchParams({
          latitude,
          longitude,

          current:
            "temperature_2m," +
            "relative_humidity_2m," +
            "apparent_temperature," +
            "weather_code," +
            "wind_speed_10m",

          timezone: "auto",

          temperature_unit:
            "celsius",

          wind_speed_unit:
            "kmh"
        });

      const response =
        await fetch(
          "https://api.open-meteo.com/v1/forecast?" +
          params.toString()
        );

      if (!response.ok) {
        throw new Error(
          "Weather request failed."
        );
      }

      return response.json();
    }

    /* =========================================================
       RENDER WEATHER
       ========================================================= */

    function renderWeather(
      data,
      place
    ) {
      if (
        !data ||
        !data.current
      ) {
        throw new Error(
          "Invalid weather data."
        );
      }

      const current =
        data.current;

      const code =
        Number(
          current.weather_code
        );

      const info =
        WEATHER_CODES[code] ||
        ["Weather", "•"];

      $("weatherIcon")
        .textContent =
          info[1];

      $("temperature")
        .textContent =
          `${Math.round(
            Number(
              current.temperature_2m
            )
          )}°`;

      $("condition")
        .textContent =
          info[0];

      $("location")
        .textContent =
          place
            ? `${place.name}${
                place.country
                  ? `, ${place.country}`
                  : ""
              }`
            : "Your location";
    }

    /* =========================================================
       WEATHER FROM COORDINATES
       ========================================================= */

    async function loadWeatherFromCoordinates(
      latitude,
      longitude,
      knownPlace = null
    ) {
      const [
        weather,
        place
      ] =
        await Promise.all([
          fetchWeather(
            latitude,
            longitude
          ),

          knownPlace
            ? Promise.resolve(
                knownPlace
              )
            : reverseGeocode(
                latitude,
                longitude
              )
        ]);

      renderWeather(
        weather,
        place
      );

      const location = {
        latitude,
        longitude,
        place
      };

      try {
        localStorage.setItem(
          "homeLocation",
          JSON.stringify(
            location
          )
        );
      } catch {
        // Ignore unavailable storage.
      }
    }

    /* =========================================================
       GET CURRENT LOCATION
       ========================================================= */

    async function loadWeather() {
      if (
        !("geolocation" in navigator)
      ) {
        throw new Error(
          "Geolocation unavailable."
        );
      }

      const position =
        await new Promise(
          (
            resolve,
            reject
          ) => {
            navigator.geolocation
              .getCurrentPosition(
                resolve,
                reject,
                {
                  enableHighAccuracy:
                    false,

                  timeout:
                    10000,

                  maximumAge:
                    900000
                }
              );
          }
        );

      const latitude =
        Number(
          position.coords.latitude
        );

      const longitude =
        Number(
          position.coords.longitude
        );

      await loadWeatherFromCoordinates(
        latitude,
        longitude
      );
    }

    /* =========================================================
       SAVED LOCATION
       ========================================================= */

    async function loadSavedWeather() {
      let saved;

      try {
        saved =
          localStorage.getItem(
            "homeLocation"
          );
      } catch {
        return false;
      }

      if (!saved) {
        return false;
      }

      try {
        const location =
          JSON.parse(saved);

        if (
          typeof location?.latitude !==
            "number" ||
          typeof location?.longitude !==
            "number"
        ) {
          return false;
        }

        await loadWeatherFromCoordinates(
          location.latitude,
          location.longitude,
          location.place || null
        );

        return true;
      } catch {
        return false;
      }
    }

    /* =========================================================
       WEATHER STARTUP
       ========================================================= */

    async function startWeather() {
      const restored =
        await loadSavedWeather();

      if (restored) {
        return;
      }

      try {
        await loadWeather();
      } catch {
        $("location")
          .textContent =
            "Tap to enable location";

        $("condition")
          .textContent =
            "Location required";
      }
    }

    /* =========================================================
       REFRESH WEATHER ON TAP
       ========================================================= */

    $("location")
      .addEventListener(
        "click",
        async () => {
          const previousText =
            $("location")
              .textContent;

          $("location")
            .textContent =
              "Refreshing…";

          try {
            await loadWeather();
          } catch {
            $("location")
              .textContent =
                previousText ||
                "Location unavailable";
          }
        }
      );

    startWeather();

  </script>
