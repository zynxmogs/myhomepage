<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#050806"
  >

  <meta
    name="description"
    content="A minimal liquid glass personal homepage with time, weather and shortcuts."
  >

  <title>Home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      color-scheme: dark;

      --bg: #050806;
      --text: #f2f5f2;
      --muted: #a0aaa3;
      --soft: #78827b;

      --green: 88, 125, 103;
      --green-bright: 111, 158, 129;
      --grey: 150, 160, 154;

      --glass-bg: rgba(255, 255, 255, 0.055);
      --glass-bg-strong: rgba(255, 255, 255, 0.075);
      --glass-border: rgba(255, 255, 255, 0.105);
      --glass-highlight: rgba(255, 255, 255, 0.055);

      --shadow:
        0 20px 70px rgba(0, 0, 0, 0.34),
        0 4px 20px rgba(0, 0, 0, 0.16);

      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);
      background: var(--bg);

      overflow-x: hidden;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================================
       MINIMAL DARK GREY + GREEN GRADIENT WALLPAPER
       ========================================================= */

    .background {
      position: fixed;
      inset: 0;
      z-index: -10;

      overflow: hidden;
      pointer-events: none;

      background:
        radial-gradient(
          75% 60% at 50% 100%,
          rgba(61, 87, 72, 0.11),
          transparent 72%
        ),
        radial-gradient(
          65% 55% at 15% 15%,
          rgba(80, 95, 87, 0.08),
          transparent 68%
        ),
        linear-gradient(
          145deg,
          #040605 0%,
          #070a08 38%,
          #070b08 68%,
          #040605 100%
        );
    }

    .gradient-layer {
      position: absolute;
      inset: -12%;

      background:
        radial-gradient(
          ellipse at 18% 20%,
          rgba(109, 126, 115, 0.11),
          transparent 31%
        ),
        radial-gradient(
          ellipse at 82% 78%,
          rgba(68, 111, 83, 0.14),
          transparent 34%
        ),
        radial-gradient(
          ellipse at 55% 48%,
          rgba(87, 97, 91, 0.045),
          transparent 44%
        );

      animation:
        wallpaperDrift 26s ease-in-out infinite alternate;

      will-change: transform;
    }

    .gradient-layer::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          120deg,
          transparent 0%,
          rgba(118, 143, 126, 0.025) 32%,
          transparent 52%,
          rgba(77, 113, 89, 0.035) 72%,
          transparent 100%
        );

      animation:
        wallpaperSweep 22s ease-in-out infinite alternate;

      will-change: transform;
    }

    .vignette {
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          ellipse at center,
          transparent 35%,
          rgba(2, 4, 3, 0.24) 100%
        );
    }

    .grain {
      position: fixed;
      inset: 0;

      z-index: -9;
      pointer-events: none;

      opacity: 0.018;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.65'/%3E%3C/svg%3E");
    }

    @keyframes wallpaperDrift {
      0% {
        transform:
          translate3d(-2%, -1%, 0)
          scale(1);
      }

      100% {
        transform:
          translate3d(2.5%, 2%, 0)
          scale(1.045);
      }
    }

    @keyframes wallpaperSweep {
      0% {
        transform:
          translate3d(-3%, 1%, 0);
        opacity: 0.65;
      }

      100% {
        transform:
          translate3d(3%, -1%, 0);
        opacity: 1;
      }
    }

    /* =========================================================
       LAYOUT
       ========================================================= */

    .shell {
      width:
        min(
          1120px,
          calc(100% - 32px)
        );

      margin: 0 auto;

      padding:
        30px
        0
        36px;
    }

    /* =========================================================
       TOP BAR
       ========================================================= */

    .topbar {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: space-between;

      min-height: 36px;

      margin-bottom: 58px;
    }

    .brand {
      font-size: 12px;
      font-weight: 600;

      letter-spacing: 0.085em;

      color:
        rgba(
          244,
          247,
          244,
          0.72
        );
    }

    /* =========================================================
       LIQUID GLASS BASE
       ========================================================= */

    .glass {
      border:
        1px
        solid
        var(--glass-border);

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.072),
          rgba(255, 255, 255, 0.028) 46%,
          rgba(93, 125, 103, 0.028) 100%
        );

      box-shadow:
        var(--shadow),
        inset
        0
        1px
        0
        var(--glass-highlight);

      backdrop-filter:
        blur(18px)
        saturate(120%);

      -webkit-backdrop-filter:
        blur(18px)
        saturate(120%);
    }

    /* =========================================================
       WEATHER
       ========================================================= */

    .weather-widget {
      position: absolute;

      top: 0;
      right: 0;

      display: inline-flex;
      align-items: center;

      gap: 8px;

      min-height: 36px;

      padding:
        6px
        10px;

      border-radius: 14px;

      max-width: 220px;

      transition:
        transform 0.22s ease,
        background 0.22s ease,
        border-color 0.22s ease;
    }

    .weather-widget:hover {
      transform:
        translateY(-1px);

      border-color:
        rgba(
          130,
          160,
          142,
          0.16
        );

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.08),
          rgba(255, 255, 255, 0.035),
          rgba(81, 120, 94, 0.045)
        );
    }

    .weather-mini-icon {
      width: 21px;
      flex: 0 0 21px;

      font-size: 17px;
      line-height: 1;

      text-align: center;

      filter:
        drop-shadow(
          0
          4px
          12px
          rgba(
            112,
            150,
            125,
            0.12
          )
        );
    }

    .weather-mini-info {
      min-width: 0;
    }

    .weather-mini-top {
      display: flex;
      align-items: baseline;

      gap: 5px;

      line-height: 1;
    }

    .weather-mini-temp {
      font-size: 13px;
      font-weight: 600;

      letter-spacing:
        -0.035em;

      font-variant-numeric:
        tabular-nums;
    }

    .weather-mini-condition {
      max-width: 92px;

      font-size: 9px;

      color: var(--muted);

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .weather-mini-location {
      margin-top: 3px;

      font-size: 9px;

      color: var(--soft);

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      cursor: pointer;

      transition:
        color 0.2s ease;
    }

    .weather-mini-location:hover {
      color:
        rgba(
          194,
          210,
          199,
          0.9
        );
    }

    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      text-align: center;

      margin:
        0
        auto
        46px;
    }

    .eyebrow {
      min-height: 20px;

      margin-bottom: 12px;

      color: var(--muted);

      font-size: 14px;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .time {
      font-size:
        clamp(
          66px,
          13vw,
          148px
        );

      line-height: 0.9;

      letter-spacing:
        -0.075em;

      font-weight: 600;

      font-variant-numeric:
        tabular-nums;

      margin-left:
        -0.075em;

      text-shadow:
        0
        0
        35px
        rgba(
          103,
          138,
          116,
          0.035
        );
    }

    .date {
      margin-top: 18px;

      color: var(--muted);

      font-size: 15px;

      letter-spacing: 0.008em;
    }

    /* =========================================================
       SEARCH — LIQUID GLASS
       ========================================================= */

    .search {
      position: relative;

      width:
        min(
          700px,
          100%
        );

      margin:
        0
        auto;

      isolation: isolate;
    }

    .search::before {
      content: "";

      position: absolute;

      inset:
        -1px;

      z-index: -1;

      border-radius: 21px;

      background:
        conic-gradient(
          from 180deg,
          rgba(
            124,
            145,
            132,
            0.0
          ),
          rgba(
            103,
            143,
            119,
            0.52
          ),
          rgba(
            168,
            177,
            171,
            0.34
          ),
          rgba(
            72,
            124,
            88,
            0.42
          ),
          rgba(
            124,
            145,
            132,
            0.0
          )
        );

      opacity: 0;

      filter:
        blur(0.5px);

      transform:
        scale(0.992);

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;
    }

    .search::after {
      content: "";

      position: absolute;

      left: 12%;
      right: 12%;
      bottom: -12px;

      height: 18px;

      border-radius: 50%;

      background:
        radial-gradient(
          ellipse,
          rgba(
            92,
            134,
            108,
            0.11
          ),
          transparent 70%
        );

      filter:
        blur(11px);

      opacity: 0;

      transform:
        scaleX(0.86);

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;
    }

    .search:focus-within::before {
      opacity: 0.72;

      transform:
        scale(1);

      animation:
        liquidBorder 5s linear infinite;
    }

    .search:focus-within::after {
      opacity: 0.75;

      transform:
        scaleX(1);
    }

    .search input {
      position: relative;

      width: 100%;

      height: 60px;

      padding:
        0
        55px
        0
        21px;

      border:
        1px
        solid
        rgba(
          255,
          255,
          255,
          0.095
        );

      border-radius: 19px;

      outline: none;

      color: var(--text);

      background:
        linear-gradient(
          135deg,
          rgba(
            255,
            255,
            255,
            0.065
          ),
          rgba(
            255,
            255,
            255,
            0.028
          ) 48%,
          rgba(
            79,
            119,
            92,
            0.035
          )
        );

      box-shadow:
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.045
        ),
        inset
        0
        -1px
        0
        rgba(
          0,
          0,
          0,
          0.10
        ),
        0
        12px
        42px
        rgba(
          0,
          0,
          0,
          0.16
        );

      backdrop-filter:
        blur(18px)
        saturate(125%);

      -webkit-backdrop-filter:
        blur(18px)
        saturate(125%);

      transition:
        transform 0.3s cubic-bezier(
          0.2,
          0.8,
          0.2,
          1
        ),
        border-color 0.3s ease,
        background 0.3s ease,
        box-shadow 0.3s ease;
    }

    .search input::placeholder {
      color:
        rgba(
          135,
          143,
          138,
          0.88
        );

      transition:
        color 0.2s ease;
    }

    .search input:focus {
      transform:
        translateY(-2px)
        scale(1.006);

      border-color:
        rgba(
          172,
          189,
          178,
          0.18
        );

      background:
        linear-gradient(
          135deg,
          rgba(
            255,
            255,
            255,
            0.082
          ),
          rgba(
            255,
            255,
            255,
            0.038
          ) 48%,
          rgba(
            82,
            130,
            98,
            0.055
          )
        );

      box-shadow:
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.06
        ),
        0
        18px
        54px
        rgba(
          0,
          0,
          0,
          0.20
        ),
        0
        0
        28px
        rgba(
          88,
          133,
          103,
          0.075
        );
    }

    .search input:focus::placeholder {
      color:
        rgba(
          172,
          181,
          175,
          0.95
        );
    }

    .search-icon {
      position: absolute;

      right: 20px;
      top: 50%;

      width: 20px;
      height: 20px;

      transform:
        translateY(-50%);

      color: #8d9790;

      pointer-events: none;

      transition:
        transform 0.3s cubic-bezier(
          0.2,
          0.8,
          0.2,
          1
        ),
        color 0.25s ease;
    }

    .search:focus-within
    .search-icon {
      color:
        rgba(
          177,
          201,
          185,
          0.92
        );

      transform:
        translateY(-50%)
        scale(1.05);
    }

    @keyframes liquidBorder {
      0% {
        transform:
          scale(1)
          rotate(0deg);
      }

      50% {
        transform:
          scale(1.004)
          rotate(180deg);
      }

      100% {
        transform:
          scale(1)
          rotate(360deg);
      }
    }

    /* =========================================================
       SHORTCUTS
       ========================================================= */

    .shortcuts {
      width:
        min(
          900px,
          100%
        );

      margin:
        24px
        auto
        0;
    }

    .shortcuts-head {
      display: flex;

      align-items: center;
      justify-content: center;

      margin-bottom: 13px;
    }

    .label {
      font-size: 10px;

      font-weight: 600;

      color: #89928c;

      text-transform: uppercase;

      letter-spacing:
        0.14em;
    }

    .shortcut-grid {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 10px;
    }

    .shortcut {
      position: relative;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      min-height: 44px;

      padding:
        0
        17px;

      border-radius:
        999px;

      border:
        1px
        solid
        rgba(
          255,
          255,
          255,
          0.08
        );

      background:
        linear-gradient(
          135deg,
          rgba(
            255,
            255,
            255,
            0.065
          ),
          rgba(
            255,
            255,
            255,
            0.028
          ) 48%,
          rgba(
            71,
            111,
            84,
            0.045
          )
        );

      color:
        rgba(
          230,
          235,
          231,
          0.92
        );

      box-shadow:
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.045
        ),
        inset
        0
        -1px
        0
        rgba(
          0,
          0,
          0,
          0.10
        ),
        0
        8px
        24px
        rgba(
          0,
          0,
          0,
          0.14
        );

      backdrop-filter:
        blur(15px)
        saturate(120%);

      -webkit-backdrop-filter:
        blur(15px)
        saturate(120%);

      overflow: hidden;

      transition:
        transform 0.2s cubic-bezier(
          0.2,
          0.8,
          0.2,
          1
        ),
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .shortcut::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          110deg,
          rgba(
            255,
            255,
            255,
            0.08
          ),
          transparent 40%,
          rgba(
            79,
            128,
            97,
            0.09
          )
        );

      opacity: 0;

      transition:
        opacity 0.2s ease;

      pointer-events: none;
    }

    .shortcut:hover {
      transform:
        translateY(-2px);

      border-color:
        rgba(
          125,
          155,
          136,
          0.17
        );

      background:
        linear-gradient(
          135deg,
          rgba(
            255,
            255,
            255,
            0.08
          ),
          rgba(
            255,
            255,
            255,
            0.038
          ) 48%,
          rgba(
            74,
            123,
            91,
            0.065
          )
        );

      box-shadow:
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.06
        ),
        0
        12px
        30px
        rgba(
          0,
          0,
          0,
          0.18
        ),
        0
        0
        20px
        rgba(
          82,
          125,
          97,
          0.045
        );
    }

    .shortcut:hover::before {
      opacity: 1;
    }

    .shortcut:active {
      transform:
        translateY(0)
        scale(0.97);
    }

    .shortcut svg {
      position: relative;
      z-index: 1;

      flex:
        0
        0
        auto;

      opacity: 0.82;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .shortcut:hover svg {
      transform:
        scale(1.045);

      opacity: 1;
    }

    .shortcut span {
      position: relative;
      z-index: 1;

      font-size: 11px;

      font-weight: 500;

      white-space: nowrap;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      text-align: center;

      color: #5f6862;

      font-size: 10px;

      margin-top: 30px;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {
      .shell {
        width:
          min(
            100% - 20px,
            1120px
          );

        padding-top: 20px;
      }

      .topbar {
        margin-bottom: 42px;
      }

      .weather-widget {
        top: -2px;
        right: 0;

        max-width: 170px;
      }

      .hero {
        margin-bottom: 40px;
      }

      .time {
        font-size:
          clamp(
            58px,
            18vw,
            92px
          );
      }

      .date {
        font-size: 13px;
      }

      .shortcuts {
        margin-top: 22px;
      }

      .shortcut {
        min-height: 42px;

        padding:
          0
          15px;
      }

      .shortcut span {
        font-size: 11px;
      }
    }

    @media (max-width: 430px) {
      .weather-widget {
        max-width: 155px;

        padding:
          6px
          8px;
      }

      .weather-mini-condition {
        max-width: 68px;
      }

      .time {
        font-size:
          clamp(
            54px,
            18vw,
            82px
          );
      }

      .search input {
        height: 57px;
      }

      .shortcut-grid {
        gap: 8px;
      }

      .shortcut {
        padding:
          0
          13px;
      }

      .orb {
        transform:
          translate3d(0, 0, 0);
      }
    }

    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       BACKGROUND
       ======================================================= -->

  <div
    class="background"
    aria-hidden="true"
  >
    <div class="gradient-layer"></div>
    <div class="vignette"></div>
  </div>

  <div
    class="grain"
    aria-hidden="true"
  ></div>

  <main class="shell">

    <!-- =======================================================
         TOP BAR
         ======================================================= -->

    <header class="topbar">

      <div class="brand">
        HOME
      </div>

      <!-- Minimal weather -->
      <div
        class="weather-widget glass"
        aria-label="Current weather"
      >

        <div
          class="weather-mini-icon"
          id="weatherIcon"
          aria-hidden="true"
        >
          —
        </div>

        <div class="weather-mini-info">

          <div class="weather-mini-top">

            <div
              class="weather-mini-temp"
              id="temperature"
            >
              --°
            </div>

            <div
              class="weather-mini-condition"
              id="condition"
            >
              Loading…
            </div>

          </div>

          <div
            class="weather-mini-location"
            id="location"
            title="Tap to refresh location"
          >
            Detecting location…
          </div>

        </div>

      </div>

    </header>

    <!-- =======================================================
         HERO
         ======================================================= -->

    <section
      class="hero"
      aria-label="Welcome"
    >

      <div
        class="eyebrow"
        id="greeting"
      >
        Welcome.
      </div>

      <div
        class="time"
        id="time"
      >
        --:--
      </div>

      <div
        class="date"
        id="date"
      >
        Loading date…
      </div>

    </section>

    <!-- =======================================================
         SEARCH
         ======================================================= -->

    <form
      class="search"

  <script>
    "use strict";

    /* =========================================================
       HELPER
       ========================================================= */

    const $ = (id) =>
      document.getElementById(id);

    /* =========================================================
       WEATHER CODES
       ========================================================= */

    const WEATHER_CODES = {
      0: ["Clear sky", "☀️"],
      1: ["Mainly clear", "🌤️"],
      2: ["Partly cloudy", "⛅"],
      3: ["Overcast", "☁️"],

      45: ["Fog", "🌫️"],
      48: ["Rime fog", "🌫️"],

      51: ["Light drizzle", "🌦️"],
      53: ["Drizzle", "🌦️"],
      55: ["Heavy drizzle", "🌧️"],

      56: ["Freezing drizzle", "🌧️"],
      57: ["Heavy freezing drizzle", "🌧️"],

      61: ["Light rain", "🌦️"],
      63: ["Rain", "🌧️"],
      65: ["Heavy rain", "🌧️"],

      66: ["Freezing rain", "🌧️"],
      67: ["Heavy freezing rain", "🌧️"],

      71: ["Light snow", "🌨️"],
      73: ["Snow", "❄️"],
      75: ["Heavy snow", "❄️"],
      77: ["Snow grains", "❄️"],

      80: ["Light showers", "🌦️"],
      81: ["Showers", "🌧️"],
      82: ["Heavy showers", "⛈️"],

      85: ["Snow showers", "🌨️"],
      86: ["Heavy snow showers", "🌨️"],

      95: ["Thunderstorm", "⛈️"],
      96: ["Thunderstorm + hail", "⛈️"],
      99: ["Thunderstorm + hail", "⛈️"]
    };

    /* =========================================================
       GREETINGS
       ========================================================= */

    const GREETINGS = {
      night: [
        "Still up?",
        "Late-night mode.",
        "Good night.",
        "The world is quiet.",
        "Burning the midnight oil?",
        "One more thing before bed?"
      ],

      earlyMorning: [
        "Good morning.",
        "Morning.",
        "Rise and shine.",
        "A fresh start.",
        "New day, new start.",
        "Good morning, Zynx."
      ],

      morning: [
        "Good morning.",
        "Hope your morning is going well.",
        "Morning, Zynx.",
        "Ready for the day?",
        "Hope you're having a good start.",
        "A good morning to you."
      ],

      midday: [
        "Almost noon.",
        "Good afternoon.",
        "Midday already.",
        "Halfway through the day.",
        "How's your day going?",
        "Hope the day is going well."
      ],

      afternoon: [
        "Good afternoon.",
        "How's your afternoon?",
        "Hope your day is going well.",
        "Afternoon.",
        "Still plenty of day left.",
        "Hope you're having a good one."
      ],

      evening: [
        "Good evening.",
        "Evening.",
        "Hope you had a good day.",
        "A quiet evening.",
        "Time to slow down.",
        "Good to see you."
      ],

      lateEvening: [
        "Good evening.",
        "Winding down?",
        "Late evening.",
        "Still going strong?",
        "A calm night ahead.",
        "Almost time to call it a day."
      ]
    };

    function getGreeting(hour) {
      if (hour < 5) {
        return GREETINGS.night;
      }

      if (hour < 9) {
        return GREETINGS.earlyMorning;
      }

      if (hour < 12) {
        return GREETINGS.morning;
      }

      if (hour < 14) {
        return GREETINGS.midday;
      }

      if (hour < 18) {
        return GREETINGS.afternoon;
      }

      if (hour < 21) {
        return GREETINGS.evening;
      }

      return GREETINGS.lateEvening;
    }

    /* =========================================================
       CLOCK
       ========================================================= */

    function updateClock() {
      const now =
        new Date();

      const timeString =
        now.toLocaleTimeString(
          [],
          {
            hour: "numeric",
            minute: "2-digit",
            hour12: true
          }
        );

      const dateString =
        now.toLocaleDateString(
          [],
          {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        );

      const greetings =
        getGreeting(
          now.getHours()
        );

      const greetingIndex =
        (
          now.getDate() +
          now.getMonth() +
          now.getDay()
        ) %
        greetings.length;

      $("time").textContent =
        timeString;

      $("date").textContent =
        dateString;

      $("greeting").textContent =
        greetings[greetingIndex];

      document.title =
        `${timeString} · Home`;
    }

    updateClock();

    setInterval(
      updateClock,
      1000
    );

    /* =========================================================
       SEARCH
       ========================================================= */

    $("searchForm")
      .addEventListener(
        "submit",
        (event) => {
          event.preventDefault();

          const query =
            $("searchInput")
              .value
              .trim();

          if (!query) {
            return;
          }

          window.location.href =
            "https://www.google.com/search?q=" +
            encodeURIComponent(query);
        }
      );

    /* =========================================================
       REVERSE GEOCODING
       ========================================================= */

    async function reverseGeocode(
      latitude,
      longitude
    ) {
      const url =
        "https://api.bigdatacloud.net/data/reverse-geocode-client" +
        `?latitude=${encodeURIComponent(latitude)}` +
        `&longitude=${encodeURIComponent(longitude)}` +
        "&localityLanguage=en";

      try {
        const response =
          await fetch(url);

        if (!response.ok) {
          throw new Error(
            "Reverse geocoding failed."
          );
        }

        const data =
          await response.json();

        const name =
          data?.city ||
          data?.locality ||
          data?.principalSubdivision ||
          null;

        if (!name) {
          return null;
        }

        return {
          name,
          country:
            data?.countryName || ""
        };
      } catch {
        return null;
      }
    }

    /* =========================================================
       WEATHER API
       ========================================================= */

    async function fetchWeather(
      latitude,
      longitude
    ) {
      const params =
        new URLSearchParams({
          latitude,
          longitude,

          current:
            "temperature_2m," +
            "relative_humidity_2m," +
            "apparent_temperature," +
            "weather_code," +
            "wind_speed_10m",

          timezone:
            "auto",

          temperature_unit:
            "celsius",

          wind_speed_unit:
            "kmh"
        });

      const response =
        await fetch(
          "https://api.open-meteo.com/v1/forecast?" +
          params.toString()
        );

      if (!response.ok) {
        throw new Error(
          "Weather request failed."
        );
      }

      return response.json();
    }

    /* =========================================================
       RENDER WEATHER
       ========================================================= */

    function renderWeather(
      data,
      place
    ) {
      if (
        !data ||
        !data.current
      ) {
        throw new Error(
          "Invalid weather data."
        );
      }

      const current =
        data.current;

      const code =
        Number(
          current.weather_code
        );

      const info =
        WEATHER_CODES[code] ||
        ["Weather", "•"];

      $("weatherIcon")
        .textContent =
          info[1];

      $("temperature")
        .textContent =
          `${Math.round(
            Number(
              current.temperature_2m
            )
          )}°`;

      $("condition")
        .textContent =
          info[0];

      $("location")
        .textContent =
          place
            ? `${place.name}${
                place.country
                  ? `, ${place.country}`
                  : ""
              }`
            : "Your location";
    }

    /* =========================================================
       WEATHER FROM COORDINATES
       ========================================================= */

    async function loadWeatherFromCoordinates(
      latitude,
      longitude,
      knownPlace = null
    ) {
      const [
        weather,
        place
      ] =
        await Promise.all([
          fetchWeather(
            latitude,
            longitude
          ),

          knownPlace
            ? Promise.resolve(
                knownPlace
              )
            : reverseGeocode(
                latitude,
                longitude
              )
        ]);

      renderWeather(
        weather,
        place
      );

      try {
        localStorage.setItem(
          "homeLocation",
          JSON.stringify({
            latitude,
            longitude,
            place
          })
        );
      } catch {
        // Storage is optional.
      }
    }

    /* =========================================================
       CURRENT LOCATION
       ========================================================= */

    async function loadWeather() {
      if (
        !("geolocation" in navigator)
      ) {
        throw new Error(
          "Geolocation unavailable."
        );
      }

      const position =
        await new Promise(
          (
            resolve,
            reject
          ) => {
            navigator.geolocation
              .getCurrentPosition(
                resolve,
                reject,
                {
                  enableHighAccuracy:
                    false,

                  timeout:
                    10000,

                  maximumAge:
                    900000
                }
              );
          }
        );

      const latitude =
        Number(
          position.coords.latitude
        );

      const longitude =
        Number(
          position.coords.longitude
        );

      await loadWeatherFromCoordinates(
        latitude,
        longitude
      );
    }

    /* =========================================================
       SAVED LOCATION
       ========================================================= */

    async function loadSavedWeather() {
      let saved = null;

      try {
        saved =
          localStorage.getItem(
            "homeLocation"
          );
      } catch {
        return false;
      }

      if (!saved) {
        return false;
      }

      try {
        const location =
          JSON.parse(saved);

        if (
          typeof location?.latitude !==
            "number" ||
          typeof location?.longitude !==
            "number"
        ) {
          return false;
        }

        await loadWeatherFromCoordinates(
          location.latitude,
          location.longitude,
          location.place || null
        );

        return true;
      } catch {
        return false;
      }
    }

    /* =========================================================
       START WEATHER
       ========================================================= */

    async function startWeather() {
      const restored =
        await loadSavedWeather();

      if (restored) {
        return;
      }

      try {
        await loadWeather();
      } catch {
        $("location")
          .textContent =
            "Tap to enable location";

        $("condition")
          .textContent =
            "Location required";
      }
    }

    /* =========================================================
       REFRESH WEATHER
       ========================================================= */

    $("location")
      .addEventListener(
        "click",
        async () => {
          const previous =
            $("location")
              .textContent;

          $("location")
            .textContent =
              "Refreshing…";

          try {
            await loadWeather();
          } catch {
            $("location")
              .textContent =
                previous ||
                "Location unavailable";
          }
        }
      );

    startWeather();
  </script>
