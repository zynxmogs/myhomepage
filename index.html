<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#07080c"
  >

  <meta
    name="description"
    content="A minimal liquid glass personal homepage."
  >

  <title>Home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,440;0,9..144,500;1,9..144,440&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      color-scheme: dark;

      --text: #f7f7f8;
      --muted: rgba(242, 244, 248, 0.66);
      --soft: rgba(242, 244, 248, 0.48);

      --accent: #cda86c;
      --accent-soft: rgba(205, 168, 108, 0.32);
      --accent-dim: rgba(205, 168, 108, 0.14);

      --glass:
        rgba(18, 20, 26, 0.34);

      --glass-strong:
        rgba(20, 22, 28, 0.46);

      --glass-light:
        rgba(255, 255, 255, 0.07);

      --border:
        rgba(255, 255, 255, 0.13);

      --border-soft:
        rgba(255, 255, 255, 0.085);

      --shadow-soft:
        0 12px 35px rgba(0, 0, 0, 0.24);

      --radius-chip: 16px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    html {
      background: #07080c;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Manrope,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      overflow-x: hidden;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================================
       AESTHETIC BACKGROUND
       ========================================================= */

    .background {
      position: fixed;
      inset: 0;
      z-index: -20;

      overflow: hidden;
      pointer-events: none;

      background: #090a0e;
    }

    .background-image,
    .background-overlay,
    .background-vignette {
      position: absolute;
      inset: 0;
    }

    .background-image {
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;

      transform:
        scale(1.035);

      filter:
        saturate(0.82)
        brightness(0.56);

      transition:
        opacity 0.9s ease,
        transform 8s ease;

      will-change:
        transform,
        opacity;
    }

    .background-image.loaded {
      transform:
        scale(1.055);
    }

    .background-overlay {
      background:
        linear-gradient(
          180deg,
          rgba(4, 5, 8, 0.52) 0%,
          rgba(4, 5, 8, 0.28) 35%,
          rgba(4, 5, 8, 0.42) 100%
        );

      backdrop-filter:
        saturate(0.9);

      -webkit-backdrop-filter:
        saturate(0.9);
    }

    .background-vignette {
      background:
        radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0.03) 30%,
          rgba(0, 0, 0, 0.47) 100%
        );
    }

    /* Extremely subtle movement, not a continuously blurred layer. */
    .background-glow {
      position: absolute;
      width: 55vw;
      height: 55vw;

      min-width: 300px;
      min-height: 300px;

      left: 10%;
      top: 10%;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(224, 195, 145, 0.05),
          transparent 68%
        );

      filter:
        blur(50px);

      opacity: 0.32;

      animation:
        ambientDrift 26s ease-in-out infinite alternate;

      will-change:
        transform;
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: -10;

      pointer-events: none;

      opacity: 0.018;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.65'/%3E%3C/svg%3E");
    }

    @keyframes ambientDrift {
      0% {
        transform:
          translate3d(-2%, -1%, 0)
          scale(0.98);
      }

      100% {
        transform:
          translate3d(4%, 4%, 0)
          scale(1.06);
      }
    }

    /* =========================================================
       GLASS SYSTEM
       ========================================================= */

    .glass {
      border:
        1px solid
        var(--border-soft);

      background:
        rgba(255, 255, 255, 0.05);

      box-shadow:
        var(--shadow-soft),
        inset
        0
        1px
        0
        rgba(255, 255, 255, 0.06);

      backdrop-filter:
        blur(20px)
        saturate(140%);

      -webkit-backdrop-filter:
        blur(20px)
        saturate(140%);
    }

    /* =========================================================
       LAYOUT
       ========================================================= */

    .shell {
      width:
        min(
          1120px,
          calc(100% - 32px)
        );

      margin:
        0
        auto;

      padding:
        30px
        0
        40px;
    }

    /* =========================================================
       TOP BAR
       ========================================================= */

    .topbar {
      position: relative;

      display: flex;
      align-items: center;

      min-height: 38px;

      margin-bottom: 60px;
    }

    .brand {
      font-family: Fraunces, serif;

      font-size: 15px;

      font-weight: 440;
      font-style: italic;

      letter-spacing:
        0.01em;

      color:
        rgba(
          255,
          255,
          255,
          0.62
        );

      text-shadow:
        0 2px 10px rgba(0,0,0,0.32);
    }

    /* =========================================================
       WEATHER
       ========================================================= */

    .weather-widget {
      position: absolute;

      top: 0;
      right: 0;

      display: inline-flex;

      align-items: center;

      gap: 8px;

      min-height: 36px;

      max-width: 220px;

      padding:
        6px
        10px;

      border-radius:
        var(--radius-chip);

      cursor: default;

      transition:
        transform 0.22s ease,
        border-color 0.22s ease,
        background 0.22s ease;
    }

    .weather-widget:hover {
      transform:
        translateY(-1px);

      border-color:
        var(--accent-soft);

      background:
        rgba(255, 255, 255, 0.075);
    }

    .weather-mini-icon {
      width: 20px;

      flex:
        0 0 20px;

      color: var(--accent);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .weather-mini-icon svg {
      width: 18px;
      height: 18px;
    }

    .weather-mini-info {
      min-width: 0;
    }

    .weather-mini-top {
      display: flex;

      align-items: baseline;

      gap: 5px;

      line-height: 1;
    }

    .weather-mini-temp {
      font-size: 13px;

      font-weight: 600;

      letter-spacing:
        -0.04em;

      font-variant-numeric:
        tabular-nums;
    }

    .weather-mini-condition {
      max-width: 90px;

      font-size: 9px;

      color: var(--muted);

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .weather-mini-location {
      margin-top: 3px;

      font-size: 9px;

      color: var(--soft);

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      cursor: pointer;

      transition:
        color 0.2s ease;
    }

    .weather-mini-location:hover {
      color:
        rgba(
          255,
          255,
          255,
          0.76
        );
    }

    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      text-align: center;

      margin:
        0
        auto
        52px;
    }

    .eyebrow {
      min-height: 20px;

      margin-bottom: 13px;

      color: var(--muted);

      font-size: 14px;

      text-shadow:
        0
        2px
        16px
        rgba(
          0,
          0,
          0,
          0.35
        );

      transition:
        opacity 0.28s ease,
        transform 0.28s ease;
    }

    .time {
      font-family: Fraunces, serif;

      font-size:
        clamp(
          60px,
          12vw,
          132px
        );

      line-height: 0.92;

      letter-spacing:
        -0.015em;

      font-weight: 440;

      font-variant-numeric:
        tabular-nums;

      text-shadow:
        0
        4px
        32px
        rgba(
          0,
          0,
          0,
          0.32
        ),
        0
        0
        70px
        rgba(
          255,
          255,
          255,
          0.035
        );
    }

    .time .time-unit {
      font-size: 0.42em;

      font-weight: 500;

      margin-left: 0.14em;

      color: var(--muted);

      vertical-align: 0.22em;
    }

    .time .time-colon {
      display: inline-block;

      color: var(--accent);

      animation:
        colonBreathe 2s ease-in-out infinite;
    }

    @keyframes colonBreathe {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    .date {
      margin-top: 18px;

      color:
        rgba(
          242,
          244,
          248,
          0.67
        );

      font-size: 14px;

      letter-spacing:
        0.01em;

      text-shadow:
        0
        2px
        14px
        rgba(
          0,
          0,
          0,
          0.38
        );
    }

    /* =========================================================
       SEARCH
       ========================================================= */

    .search {
      position: relative;

      width:
        min(
          720px,
          100%
        );

      margin:
        0
        auto;

      isolation: isolate;
    }

    .search-shell {
      position: relative;
    }

    .search-shell::before {
      content: "";

      position: absolute;

      inset: -1px;

      z-index: -1;

      border-radius:
        var(--radius-pill);

      background:
        linear-gradient(
          110deg,
          rgba(255,255,255,0.12),
          rgba(255,255,255,0.02) 40%,
          var(--accent-dim) 100%
        );

      opacity:
        0.6;
    }

    .search-shell::after {
      content: "";

      position: absolute;

      left: 12%;
      right: 12%;
      bottom: -13px;

      height: 22px;

      border-radius: 50%;

      background:
        rgba(
          0,
          0,
          0,
          0.42
        );

      filter:
        blur(18px);

      z-index: -2;

      opacity: 0.48;
    }

    .search input {
      position: relative;

      width: 100%;

      height: 60px;

      padding:
        0
        55px
        0
        21px;

      border:
        1px
        solid
        rgba(
          255,
          255,
          255,
          0.12
        );

      border-radius:
        var(--radius-pill);

      outline: none;

      color:
        rgba(
          255,
          255,
          255,
          0.95
        );

      background:
        rgba(16, 17, 22, 0.32);

      box-shadow:
        0
        18px
        55px
        rgba(
          0,
          0,
          0,
          0.28
        ),
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.07
        );

      backdrop-filter:
        blur(25px)
        saturate(130%);

      -webkit-backdrop-filter:
        blur(25px)
        saturate(130%);

      transition:
        transform 0.32s cubic-bezier(
          0.2,
          0.8,
          0.2,
          1
        ),
        border-color 0.32s ease,
        background 0.32s ease,
        box-shadow 0.32s ease;
    }

    .search input::placeholder {
      color:
        rgba(
          226,
          230,
          236,
          0.44
        );

      transition:
        color 0.2s ease;
    }

    .search input:focus {
      transform:
        translateY(-2px)
        scale(1.006);

      border-color:
        var(--accent-soft);

      background:
        rgba(16, 17, 22, 0.4);

      box-shadow:
        0
        22px
        65px
        rgba(
          0,
          0,
          0,
          0.34
        ),
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.10
        ),
        0
        0
        0
        4px
        var(--accent-dim);
    }

    .search input:focus::placeholder {
      color:
        rgba(
          235,
          238,
          243,
          0.58
        );
    }

    .search-icon {
      position: absolute;

      right: 20px;
      top: 50%;

      width: 20px;
      height: 20px;

      transform:
        translateY(-50%);

      color:
        rgba(
          235,
          238,
          243,
          0.52
        );

      pointer-events: none;

      transition:
        transform 0.3s
        cubic-bezier(
          0.2,
          0.8,
          0.2,
          1
        ),
        color 0.25s ease;
    }

    .search:focus-within
    .search-icon {
      color: var(--accent);

      transform:
        translateY(-50%)
        scale(1.06);
    }

    /* =========================================================
       SHORTCUTS
       ========================================================= */

    .shortcuts {
      width:
        min(
          940px,
          100%
        );

      margin:
        38px
        auto
        0;
    }

    .shortcut-grid {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 10px;
    }

    .shortcut {
      position: relative;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      min-height: 44px;

      padding:
        0
        17px;

      border-radius:
        var(--radius-chip);

      border:
        1px
        solid
        rgba(
          255,
          255,
          255,
          0.095
        );

      background:
        rgba(16, 17, 22, 0.26);

      box-shadow:
        var(--shadow-soft),
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.06
        );

      backdrop-filter:
        blur(18px)
        saturate(125%);

      -webkit-backdrop-filter:
        blur(18px)
        saturate(125%);

      overflow: hidden;

      transition:
        transform 0.22s cubic-bezier(
          0.2,
          0.8,
          0.2,
          1
        ),
        border-color 0.22s ease,
        background 0.22s ease,
        box-shadow 0.22s ease;
    }

    .shortcut:hover {
      transform:
        translateY(-3px);

      border-color:
        var(--accent-soft);

      background:
        rgba(20, 21, 26, 0.4);

      box-shadow:
        0
        14px
        36px
        rgba(
          0,
          0,
          0,
          0.28
        ),
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.08
        );
    }

    .shortcut:active {
      transform:
        translateY(-1px)
        scale(0.975);
    }

    .shortcut svg {
      position: relative;

      z-index: 1;

      flex:
        0
        0
        auto;

      opacity: 0.82;

      transition:
        transform 0.22s ease,
        opacity 0.22s ease;
    }

    .shortcut:hover svg {
      opacity: 1;

      color: var(--accent);

      transform:
        scale(1.05);
    }

    .shortcut span {
      position: relative;

      z-index: 1;

      font-size: 11px;

      font-weight: 500;

      white-space: nowrap;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      text-align: center;

      color:
        rgba(
          235,
          238,
          241,
          0.34
        );

      font-size: 10px;

      margin-top: 30px;

      text-shadow:
        0
        2px
        10px
        rgba(
          0,
          0,
          0,
          0.35
        );
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {
      .shell {
        width:
          min(
            100% - 20px,
            1120px
          );

        padding-top: 20px;
      }

      .topbar {
        min-height: 36px;

        margin-bottom: 43px;
      }

      .weather-widget {
        top: -2px;
        right: 0;

        max-width: 175px;
      }

      .hero {
        margin-bottom: 39px;
      }

      .time {
        font-size:
          clamp(
            52px,
            17vw,
            84px
          );
      }

      .date {
        font-size: 13px;
      }

      .shortcuts {
        margin-top: 22px;
      }

      .shortcut {
        min-height: 42px;

        padding:
          0
          15px;
      }

      .shortcut span {
        font-size: 11px;
      }

      .background-glow {
        width: 80vw;
        height: 80vw;

        left: -20%;
        top: 5%;
      }
    }

    @media (max-width: 430px) {
      .weather-widget {
        max-width: 155px;

        padding:
          6px
          8px;
      }

      .weather-mini-condition {
        max-width: 67px;
      }

      .time {
        font-size:
          clamp(
            48px,
            17vw,
            74px
          );
      }

      .search input {
        height: 57px;
      }

      .shortcut-grid {
        gap: 8px;
      }

      .shortcut {
        padding:
          0
          13px;
      }
    }

    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       BACKGROUND
       ======================================================= -->

  <div
    class="background"
    aria-hidden="true"
  >
    <div
      class="background-image"
      id="backgroundImage"
    ></div>

    <div class="background-overlay"></div>
    <div class="background-glow"></div>
    <div class="background-vignette"></div>
  </div>

  <div
    class="grain"
    aria-hidden="true"
  ></div>

  <main class="shell">

    <!-- =======================================================
         TOP BAR
         ======================================================= -->

    <header class="topbar">

      <div class="brand">
        HOME
      </div>

      <!-- Weather -->
      <div
        class="weather-widget glass"
        aria-label="Current weather"
      >

        <div
          class="weather-mini-icon"
          id="weatherIcon"
          aria-hidden="true"
        >
          —
        </div>

        <div class="weather-mini-info">

          <div class="weather-mini-top">

            <div
              class="weather-mini-temp"
              id="temperature"
            >
              --°
            </div>

            <div
              class="weather-mini-condition"
              id="condition"
            >
              Loading…
            </div>

          </div>

          <div
            class="weather-mini-location"
            id="location"
            title="Tap to refresh location"
          >
            Detecting location…
          </div>

        </div>

      </div>

    </header>

    <!-- =======================================================
         HERO
         ======================================================= -->

    <section
      class="hero"
      aria-label="Welcome"
    >

      <div
        class="eyebrow"
        id="greeting"
      >
        Welcome.
      </div>

      <div
        class="time"
        id="time"
      >
        --:--
      </div>

      <div
        class="date"
        id="date"
      >
        Loading date…
      </div>

    </section>

    <!-- =======================================================
         SEARCH
         ======================================================= -->

    <form
      class="search"
      id="searchForm"
      role="search"
    >

      <div class="search-shell">

        <input
          id="searchInput"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search the web…"
          aria-label="Search the web"
        >

        <span
          class="search-icon"
          aria-hidden="true"
        >

          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >

            <circle
              cx="11"
              cy="11"
              r="6.7"
            ></circle>

            <path
              d="m16 16 5 5"
            ></path>

          </svg>

        </span>

      </div>

    </form>

    <!-- =======================================================
         SHORTCUTS
         ======================================================= -->

    <section
      class="shortcuts"
      aria-label="Shortcuts"
    >

      <nav class="shortcut-grid">

        <!-- YouTube -->
        <a
          class="shortcut"
          href="https://youtube.com"
          target="_blank"
          rel="noopener noreferrer"
        >

          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            aria-hidden="true"
          >

            <rect
              x="3"
              y="5"
              width="18"
              height="14"
              rx="4"
            ></rect>

            <path
              d="m10 9 5 3-5 3V9Z"
            ></path>

          </svg>

          <span>
            YouTube
          </span>

        </a>

        <!-- GitHub -->
        <a
          class="shortcut"
          href="https://github.com"
          target="_blank"
          rel="noopener noreferrer"
        >

          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >

  <script>
    "use strict";

    /* =========================================================
       HELPERS
       ========================================================= */

    const $ = (id) =>
      document.getElementById(id);

    /* =========================================================
       RANDOM AESTHETIC BACKGROUNDS
       =========================================================
       
       A new image is selected every time the page opens.

       These are remote Unsplash images, so no image files need
       to be stored inside the GitHub repository.
       ========================================================= */

    const BACKGROUNDS = [
      "https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=2400&q=82",
      "https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=2400&q=82",
      "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=2400&q=82",
      "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=2400&q=82",
      "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=2400&q=82",
      "https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=2400&q=82",
      "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=2400&q=82",
      "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=2400&q=82",
      "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2400&q=82",
      "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=2400&q=82"
    ];

    function chooseRandomBackground() {
      const image =
        $("backgroundImage");

      const index =
        Math.floor(
          Math.random() *
          BACKGROUNDS.length
        );

      image.style.backgroundImage =
        `url("${BACKGROUNDS[index]}")`;

      image.classList.remove(
        "loaded"
      );

      const preload =
        new Image();

      preload.onload = () => {
        image.classList.add(
          "loaded"
        );
      };

      preload.onerror = () => {
        image.style.backgroundImage =
          "linear-gradient(135deg,#0a0b0f,#17191e)";
      };

      preload.src =
        BACKGROUNDS[index];
    }

    chooseRandomBackground();

    /* =========================================================
       WEATHER CODES
       ========================================================= */

    const WEATHER_CODES = {
      0: ["Clear sky", "sun"],
      1: ["Mainly clear", "sun-cloud"],
      2: ["Partly cloudy", "sun-cloud"],
      3: ["Overcast", "cloud"],

      45: ["Fog", "fog"],
      48: ["Rime fog", "fog"],

      51: ["Light drizzle", "drizzle"],
      53: ["Drizzle", "drizzle"],
      55: ["Heavy drizzle", "rain"],

      56: ["Freezing drizzle", "rain"],
      57: ["Heavy freezing drizzle", "rain"],

      61: ["Light rain", "drizzle"],
      63: ["Rain", "rain"],
      65: ["Heavy rain", "rain"],

      66: ["Freezing rain", "rain"],
      67: ["Heavy freezing rain", "rain"],

      71: ["Light snow", "snow"],
      73: ["Snow", "snow"],
      75: ["Heavy snow", "snow"],
      77: ["Snow grains", "snow"],

      80: ["Light showers", "drizzle"],
      81: ["Showers", "rain"],
      82: ["Heavy showers", "storm"],

      85: ["Snow showers", "snow"],
      86: ["Heavy snow showers", "snow"],

      95: ["Thunderstorm", "storm"],
      96: ["Thunderstorm + hail", "storm"],
      99: ["Thunderstorm + hail", "storm"]
    };

    /* A small bespoke icon set, drawn in the same stroke style as
       the shortcut icons above, so the weather chip feels like
       part of the same design rather than a borrowed emoji. */
    const WEATHER_ICONS = {
      sun:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12h2.6M18.9 12h2.6M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>',

      "sun-cloud":
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.3 3.4v1.6M4 8h-1.6M5.3 5.3l1.1 1.1M11.3 5.3l-1.1 1.1"/><circle cx="8.3" cy="8" r="2.5"/><path d="M7.5 20h9.6a3.6 3.6 0 0 0 .3-7.2 5 5 0 0 0-9.6 1.5A3.2 3.2 0 0 0 7.5 20Z"/></svg>',

      cloud:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 18.5h10.4a3.8 3.8 0 0 0 .3-7.6 5.3 5.3 0 0 0-10.2 1.6A3.4 3.4 0 0 0 6.5 18.5Z"/></svg>',

      fog:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 9.5h12M3 13h16M5 16.5h13M8 20h9"/></svg>',

      drizzle:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 15.5h10.4a3.8 3.8 0 0 0 .3-7.6 5.3 5.3 0 0 0-10.2 1.6A3.4 3.4 0 0 0 6.5 15.5Z"/><path d="M9 18.5l-.9 1.8M13 18.5l-.9 1.8M17 18.5l-.9 1.8"/></svg>',

      rain:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 14.5h10.4a3.8 3.8 0 0 0 .3-7.6 5.3 5.3 0 0 0-10.2 1.6A3.4 3.4 0 0 0 6.5 14.5Z"/><path d="M8.5 17.5l-1.3 3M12.5 17.5l-1.3 3M16.5 17.5l-1.3 3"/></svg>',

      snow:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 14.5h10.4a3.8 3.8 0 0 0 .3-7.6 5.3 5.3 0 0 0-10.2 1.6A3.4 3.4 0 0 0 6.5 14.5Z"/><path d="M9 17.7v3.2M7.5 19h3M14 17.7v3.2M12.5 19h3"/></svg>',

      storm:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 13.5h10.4a3.8 3.8 0 0 0 .3-7.6 5.3 5.3 0 0 0-10.2 1.6A3.4 3.4 0 0 0 6.5 13.5Z"/><path d="M13 14.5l-2.6 4h2.2l-1.4 3.5L15.5 17h-2.2z"/></svg>'
    };

    /* =========================================================
       GREETINGS
       ========================================================= */

    const GREETINGS = {
      night: [
        "Still up?",
        "Late-night mode.",
        "Good night.",
        "The world is quiet.",
        "Burning the midnight oil?",
        "One more thing before bed?"
      ],

      earlyMorning: [
        "Good morning.",
        "Morning.",
        "Rise and shine.",
        "A fresh start.",
        "New day, new start.",
        "Good morning, Zynx."
      ],

      morning: [
        "Good morning.",
        "Hope your morning is going well.",
        "Morning, Zynx.",
        "Ready for the day?",
        "Hope you're having a good start.",
        "A good morning to you."
      ],

      midday: [
        "Almost noon.",
        "Good afternoon.",
        "Midday already.",
        "Halfway through the day.",
        "How's your day going?",
        "Hope the day is going well."
      ],

      afternoon: [
        "Good afternoon.",
        "How's your afternoon?",
        "Hope your day is going well.",
        "Afternoon.",
        "Still plenty of day left.",
        "Hope you're having a good one."
      ],

      evening: [
        "Good evening.",
        "Evening.",
        "Hope you had a good day.",
        "A quiet evening.",
        "Time to slow down.",
        "Good to see you."
      ],

      lateEvening: [
        "Good evening.",
        "Winding down?",
        "Late evening.",
        "Still going strong?",
        "A calm night ahead.",
        "Almost time to call it a day."
      ]
    };

    function getGreeting(hour) {
      if (hour < 5) {
        return GREETINGS.night;
      }

      if (hour < 9) {
        return GREETINGS.earlyMorning;
      }

      if (hour < 12) {
        return GREETINGS.morning;
      }

      if (hour < 14) {
        return GREETINGS.midday;
      }

      if (hour < 18) {
        return GREETINGS.afternoon;
      }

      if (hour < 21) {
        return GREETINGS.evening;
      }

      return GREETINGS.lateEvening;
    }

    /* =========================================================
       CLOCK
       ========================================================= */

    function escapeHtml(value) {
      return value.replace(
        /[&<>]/g,
        (char) =>
          ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;"
          }[char])
      );
    }

    function updateClock() {
      const now =
        new Date();

      const timeString =
        now.toLocaleTimeString(
          [],
          {
            hour: "numeric",
            minute: "2-digit",
            hour12: true
          }
        );

      const timeMatch =
        timeString.match(
          /^(\d{1,2}):(\d{2})\s*([AaPp][Mm])$/
        );

      const dateString =
        now.toLocaleDateString(
          [],
          {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        );

      const greetings =
        getGreeting(
          now.getHours()
        );

      const greetingIndex =
        (
          now.getDate() +
          now.getMonth() +
          now.getDay()
        ) %
        greetings.length;

      if (timeMatch) {
        const [
          ,
          hour,
          minute,
          meridiem
        ] = timeMatch;

        $("time").innerHTML =
          `${escapeHtml(hour)}` +
          `<span class="time-colon">:</span>` +
          `${escapeHtml(minute)}` +
          `<span class="time-unit">${escapeHtml(meridiem.toLowerCase())}</span>`;
      } else {
        $("time").textContent =
          timeString;
      }

      $("date").textContent =
        dateString;

      $("greeting").textContent =
        greetings[greetingIndex];

      document.title =
        `${timeString} · Home`;
    }

    updateClock();

    setInterval(
      updateClock,
      1000
    );

    /* =========================================================
       SEARCH
       ========================================================= */

    $("searchForm")
      .addEventListener(
        "submit",
        (event) => {
          event.preventDefault();

          const query =
            $("searchInput")
              .value
              .trim();

          if (!query) {
            return;
          }

          window.location.href =
            "https://www.google.com/search?q=" +
            encodeURIComponent(
              query
            );
        }
      );

    /* =========================================================
       REVERSE GEOCODING
       ========================================================= */

    async function reverseGeocode(
      latitude,
      longitude
    ) {
      const url =
        "https://api.bigdatacloud.net/data/reverse-geocode-client" +
        `?latitude=${encodeURIComponent(latitude)}` +
        `&longitude=${encodeURIComponent(longitude)}` +
        "&localityLanguage=en";

      try {
        const response =
          await fetch(url);

        if (!response.ok) {
          throw new Error(
            "Reverse geocoding failed."
          );
        }

        const data =
          await response.json();

        const name =
          data?.city ||
          data?.locality ||
          data?.principalSubdivision ||
          null;

        if (!name) {
          return null;
        }

        return {
          name,

          country:
            data?.countryName || ""
        };
      } catch {
        return null;
      }
    }

    /* =========================================================
       WEATHER API
       ========================================================= */

    async function fetchWeather(
      latitude,
      longitude
    ) {
      const params =
        new URLSearchParams({
          latitude,
          longitude,

          current:
            "temperature_2m," +
            "relative_humidity_2m," +
            "apparent_temperature," +
            "weather_code," +
            "wind_speed_10m",

          timezone:
            "auto",

          temperature_unit:
            "celsius",

          wind_speed_unit:
            "kmh"
        });

      const response =
        await fetch(
          "https://api.open-meteo.com/v1/forecast?" +
          params.toString()
        );

      if (!response.ok) {
        throw new Error(
          "Weather request failed."
        );
      }

      return response.json();
    }

    /* =========================================================
       RENDER WEATHER
       ========================================================= */

    function renderWeather(
      data,
      place
    ) {
      if (
        !data ||
        !data.current
      ) {
        throw new Error(
          "Invalid weather data."
        );
      }

      const current =
        data.current;

      const code =
        Number(
          current.weather_code
        );

      const info =
        WEATHER_CODES[code] ||
        ["Weather", "cloud"];

      $("weatherIcon")
        .innerHTML =
          WEATHER_ICONS[info[1]] ||
          WEATHER_ICONS.cloud;

      $("temperature")
        .textContent =
          `${Math.round(
            Number(
              current.temperature_2m
            )
          )}°`;

      $("condition")
        .textContent =
          info[0];

      $("location")
        .textContent =
          place
            ? `${place.name}${
                place.country
                  ? `, ${place.country}`
                  : ""
              }`
            : "Your location";
    }

    /* =========================================================
       WEATHER FROM COORDINATES
       ========================================================= */

    async function loadWeatherFromCoordinates(
      latitude,
      longitude,
      knownPlace = null
    ) {
      const [
        weather,
        place
      ] =
        await Promise.all([
          fetchWeather(
            latitude,
            longitude
          ),

          knownPlace
            ? Promise.resolve(
                knownPlace
              )
            : reverseGeocode(
                latitude,
                longitude
              )
        ]);

      renderWeather(
        weather,
        place
      );

      try {
        localStorage.setItem(
          "homeLocation",
          JSON.stringify({
            latitude,
            longitude,
            place
          })
        );
      } catch {
        // Storage is optional.
      }
    }

    /* =========================================================
       CURRENT LOCATION
       ========================================================= */

    async function loadWeather() {
      if (
        !("geolocation" in navigator)
      ) {
        throw new Error(
          "Geolocation unavailable."
        );
      }

      const position =
        await new Promise(
          (
            resolve,
            reject
          ) => {
            navigator.geolocation
              .getCurrentPosition(
                resolve,
                reject,
                {
                  enableHighAccuracy:
                    false,

                  timeout:
                    10000,

                  maximumAge:
                    900000
                }
              );
          }
        );

      const latitude =
        Number(
          position.coords.latitude
        );

      const longitude =
        Number(
          position.coords.longitude
        );

      await loadWeatherFromCoordinates(
        latitude,
        longitude
      );
    }

    /* =========================================================
       SAVED LOCATION
       ========================================================= */

    async function loadSavedWeather() {
      let saved = null;

      try {
        saved =
          localStorage.getItem(
            "homeLocation"
          );
      } catch {
        return false;
      }

      if (!saved) {
        return false;
      }

      try {
        const location =
          JSON.parse(saved);

        if (
          typeof location?.latitude !==
            "number" ||
          typeof location?.longitude !==
            "number"
        ) {
          return false;
        }

        await loadWeatherFromCoordinates(
          location.latitude,
          location.longitude,
          location.place || null
        );

        return true;
      } catch {
        return false;
      }
    }

    /* =========================================================
       START WEATHER
       ========================================================= */

    async function startWeather() {
      const restored =
        await loadSavedWeather();

      if (restored) {
        return;
      }

      try {
        await loadWeather();
      } catch {
        $("location")
          .textContent =
            "Tap to enable location";

        $("condition")
          .textContent =
            "Location required";
      }
    }

    /* =========================================================
       REFRESH WEATHER
       ========================================================= */

    $("location")
      .addEventListener(
        "click",
        async () => {
          const previous =
            $("location")
              .textContent;

          $("location")
            .textContent =
              "Refreshing…";

          try {
            await loadWeather();
          } catch {
            $("location")
              .textContent =
                previous ||
                "Location unavailable";
          }
        }
      );

    startWeather();
  </script>
