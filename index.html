<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#050609"
  >

  <meta
    name="description"
    content="Minimal liquid glass personal homepage."
  >

  <title>Home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      color-scheme: dark;

      --text: #f7f7f8;
      --muted: rgba(245, 247, 249, 0.66);
      --soft: rgba(245, 247, 249, 0.46);

      --glass-border: rgba(255, 255, 255, 0.12);

      --shadow:
        0 22px 65px rgba(0, 0, 0, 0.38),
        0 5px 24px rgba(0, 0, 0, 0.20);

      --shadow-soft:
        0 12px 34px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;

      min-height: 100%;

      margin: 0;
      padding: 0;

      background: #050609;
    }

    html {
      overflow: hidden;
    }

    body {
      overflow: hidden;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;

      overscroll-behavior: none;
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================================
       APP
       ========================================================= */

    .app {
      position: relative;

      width: 100%;
      height: 100dvh;

      min-height: 100dvh;

      overflow: hidden;

      isolation: isolate;
    }

    /* =========================================================
       LOCAL AESTHETIC WALLPAPER
       ========================================================= */

    .wallpaper {
      position: fixed;

      inset: 0;

      z-index: -20;

      overflow: hidden;

      pointer-events: none;

      background: #050609;
    }

    .wallpaper-image {
      position: absolute;

      inset: -3%;

      width: 106%;
      height: 106%;

      background:
        #08090d;

      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;

      transform: scale(1.025);

      transition:
        opacity 0.65s ease,
        transform 7s ease;

      will-change: transform;
    }

    .wallpaper-image.loaded {
      transform: scale(1.045);
    }

    /*
      Keeps every generated wallpaper dark enough
      for the glass UI to stay readable.
    */

    .wallpaper-overlay {
      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          180deg,
          rgba(3, 4, 7, 0.54) 0%,
          rgba(3, 4, 7, 0.27) 42%,
          rgba(3, 4, 7, 0.49) 100%
        );

      pointer-events: none;
    }

    .wallpaper-overlay::after {
      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.18),
          transparent 28%,
          transparent 72%,
          rgba(0, 0, 0, 0.18)
        );
    }

    .wallpaper-vignette {
      position: absolute;

      inset: 0;

      background:
        radial-gradient(
          ellipse at center,
          transparent 28%,
          rgba(0, 0, 0, 0.52) 100%
        );
    }

    .wallpaper-shine {
      position: absolute;

      width: 55vw;
      height: 55vw;

      min-width: 260px;
      min-height: 260px;

      left: 15%;
      top: 10%;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.032),
          transparent 68%
        );

      filter: blur(38px);

      opacity: 0.35;

      animation:
        shineDrift
        24s
        ease-in-out
        infinite
        alternate;

      will-change: transform;
    }

    .grain {
      position: fixed;

      inset: 0;

      z-index: -10;

      pointer-events: none;

      opacity: 0.018;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.7'/%3E%3C/svg%3E");
    }

    @keyframes shineDrift {
      0% {
        transform:
          translate3d(-3%, -2%, 0)
          scale(0.97);
      }

      100% {
        transform:
          translate3d(4%, 4%, 0)
          scale(1.05);
      }
    }

    /* =========================================================
       GLASS SYSTEM
       ========================================================= */

    .glass {
      border:
        1px
        solid
        var(--glass-border);

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.085),
          rgba(18, 19, 24, 0.25) 52%,
          rgba(255, 255, 255, 0.038)
        );

      box-shadow:
        var(--shadow),
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.07
        ),
        inset
        0
        -1px
        0
        rgba(
          0,
          0,
          0,
          0.14
        );

      backdrop-filter:
        blur(20px)
        saturate(125%);

      -webkit-backdrop-filter:
        blur(20px)
        saturate(125%);
    }

    /* =========================================================
       LAYOUT
       ========================================================= */

    .shell {
      position: relative;

      width:
        min(
          1120px,
          calc(100% - 32px)
        );

      height: 100%;

      margin: 0 auto;

      padding:
        28px
        0
        20px;

      display: flex;

      flex-direction: column;

      overflow: hidden;
    }

    /* =========================================================
       TOP BAR
       ========================================================= */

    .topbar {
      position: relative;

      flex:
        0
        0
        auto;

      min-height: 38px;

      margin-bottom: 38px;
    }

    .brand {
      position: absolute;

      left: 0;
      top: 50%;

      transform:
        translateY(-50%);

      font-size: 12px;

      font-weight: 600;

      letter-spacing:
        0.09em;

      color:
        rgba(
          255,
          255,
          255,
          0.74
        );

      text-shadow:
        0
        2px
        14px
        rgba(
          0,
          0,
          0,
          0.45
        );
    }

    /* =========================================================
       WEATHER
       ========================================================= */

    .weather-widget {
      position: absolute;

      top: 0;
      right: 0;

      display: inline-flex;

      align-items: center;

      gap: 8px;

      min-height: 36px;

      max-width: 220px;

      padding:
        6px
        10px;

      border-radius: 14px;

      transition:
        transform 0.22s ease,
        border-color 0.22s ease,
        background 0.22s ease;
    }

    .weather-widget:hover {
      transform:
        translateY(-1px);

      border-color:
        rgba(
          255,
          255,
          255,
          0.18
        );

      background:
        linear-gradient(
          135deg,
          rgba(
            255,
            255,
            255,
            0.10
          ),
          rgba(
            20,
            21,
            26,
            0.32
          )
        );
    }

    .weather-mini-icon {
      width: 20px;

      flex:
        0
        0
        20px;

      font-size: 17px;

      line-height: 1;

      text-align: center;
    }

    .weather-mini-info {
      min-width: 0;
    }

    .weather-mini-top {
      display: flex;

      align-items: baseline;

      gap: 5px;

      line-height: 1;
    }

    .weather-mini-temp {
      font-size: 13px;

      font-weight: 600;

      letter-spacing:
        -0.035em;

      font-variant-numeric:
        tabular-nums;
    }

    .weather-mini-condition {
      max-width: 90px;

      font-size: 9px;

      color: var(--muted);

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .weather-mini-location {
      max-width: 150px;

      margin-top: 3px;

      font-size: 9px;

      color: var(--soft);

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      cursor: pointer;

      transition:
        color 0.2s ease;
    }

    .weather-mini-location:hover {
      color:
        rgba(
          255,
          255,
          255,
          0.78
        );
    }

    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      flex:
        0
        0
        auto;

      text-align: center;

      margin:
        0
        auto
        35px;
    }

    .eyebrow {
      min-height: 20px;

      margin-bottom: 11px;

      font-size: 14px;

      color: var(--muted);

      text-shadow:
        0
        2px
        14px
        rgba(
          0,
          0,
          0,
          0.4
        );

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .time {
      font-size:
        clamp(
          64px,
          12.5vw,
          144px
        );

      line-height:
        0.88;

      letter-spacing:
        -0.078em;

      font-weight: 600;

      font-variant-numeric:
        tabular-nums;

      margin-left:
        -0.078em;

      text-shadow:
        0
        6px
        36px
        rgba(
          0,
          0,
          0,
          0.36
        ),
        0
        0
        72px
        rgba(
          255,
          255,
          255,
          0.025
        );
    }

    .date {
      margin-top: 16px;

      color:
        rgba(
          242,
          244,
          248,
          0.68
        );

      font-size: 14px;

      letter-spacing:
        0.008em;

      text-shadow:
        0
        2px
        14px
        rgba(
          0,
          0,
          0,
          0.38
        );
    }

    /* =========================================================
       SEARCH
       ========================================================= */

    .search {
      position: relative;

      flex:
        0
        0
        auto;

      width:
        min(
          720px,
          100%
        );

      margin:
        0
        auto;

      isolation: isolate;
    }

    .search::before {
      content: "";

      position: absolute;

      inset: -1px;

      z-index: -1;

      border-radius: 21px;

      background:
        linear-gradient(
          110deg,
          rgba(
            255,
            255,
            255,
            0.11
          ),
          rgba(
            255,
            255,
            255,
            0.025
          ),
          rgba(
            255,
            255,
            255,
            0.11
          ),
          rgba(
            255,
            255,
            255,
            0.025
          )
        );

      background-size:
        250% 100%;

      opacity: 0.42;

      animation:
        searchBorder
        10s
        ease-in-out
        infinite;

      will-change:
        background-position;
    }

    .search::after {
      content: "";

      position: absolute;

      left: 12%;
      right: 12%;
      bottom: -12px;

      height: 18px;

      border-radius: 50%;

      background:
        rgba(
          0,
          0,
          0,
          0.40
        );

      filter:
        blur(14px);

      z-index: -2;
    }

    .search input {
      display: block;

      width: 100%;

      height: 60px;

      padding:
        0
        55px
        0
        21px;

      border:
        1px
        solid
        rgba(
          255,
          255,
          255,
          0.11
        );

      border-radius: 19px;

      outline: none;

      color:
        rgba(
          255,
          255,
          255,
          0.96
        );

      background:
        linear-gradient(
          135deg,
          rgba(
            255,
            255,
            255,
            0.078
          ),
          rgba(
            10,
            11,
            15,
            0.34
          ) 52%,
          rgba(
            255,
            255,
            255,
            0.045
          )
        );

      box-shadow:
        0
        18px
        55px
        rgba(
          0,
          0,
          0,
          0.30
        ),
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.075
        ),
        inset
        0
        -1px
        0
        rgba(
          0,
          0,
          0,
          0.15
        );

      backdrop-filter:
        blur(23px)
        saturate(130%);

      -webkit-backdrop-filter:
        blur(23px)
        saturate(130%);

      transition:
        transform 0.30s
          cubic-bezier(
            0.2,
            0.8,
            0.2,
            1
          ),
        border-color 0.30s ease,
        background 0.30s ease,
        box-shadow 0.30s ease;
    }

    .search input::placeholder {
      color:
        rgba(
          230,
          233,
          238,
          0.46
        );

      transition:
        color 0.2s ease;
    }

    .search input:focus {
      transform:
        translateY(-2px)
        scale(1.005);

      border-color:
        rgba(
          255,
          255,
          255,
          0.20
        );

      background:
        linear-gradient(
          135deg,
          rgba(
            255,
            255,
            255,
            0.105
          ),
          rgba(
            10,
            11,
            15,
            0.39
          ) 52%,
          rgba(
            255,
            255,
            255,
            0.06
          )
        );

      box-shadow:
        0
        22px
        62px
        rgba(
          0,
          0,
          0,
          0.35
        ),
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.10
        ),
        0
        0
        34px
        rgba(
          255,
          255,
          255,
          0.045
        );
    }

    .search input:focus::placeholder {
      color:
        rgba(
          240,
          243,
          247,
          0.60
        );
    }

    .search-icon {
      position: absolute;

      right: 20px;
      top: 50%;

      width: 20px;
      height: 20px;

      transform:
        translateY(-50%);

      color:
        rgba(
          235,
          238,
          243,
          0.54
        );

      pointer-events: none;

      transition:
        transform 0.30s
          cubic-bezier(
            0.2,
            0.8,
            0.2,
            1
          ),
        color 0.25s ease;
    }

    .search:focus-within
    .search-icon {
      color:
        rgba(
          255,
          255,
          255,
          0.80
        );

      transform:
        translateY(-50%)
        scale(1.06);
    }

    @keyframes searchBorder {
      0% {
        background-position:
          0% 50%;
      }

      50% {
        background-position:
          100% 50%;
      }

      100% {
        background-position:
          0% 50%;
      }
    }

    /* =========================================================
       SHORTCUTS
       ========================================================= */

    .shortcuts {
      flex:
        0
        0
        auto;

      width:
        min(
          800px,
          100%
        );

      margin:
        20px
        auto
        0;
    }

    .shortcut-grid {
      display: flex;

      align-items: center;
      justify-content: center;

      flex-wrap: wrap;

      gap: 10px;
    }

    .shortcut {
      position: relative;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      min-height: 44px;

      padding:
        0
        18px;

      border:
        1px
        solid
        rgba(
          255,
          255,
          255,
          0.095
        );

      border-radius:
        999px;

      background:
        linear-gradient(
          135deg,
          rgba(
            255,
            255,
            255,
            0.078
          ),
          rgba(
            11,
            12,
            16,
            0.31
          ) 52%,
          rgba(
            255,
            255,
            255,
            0.043
          )
        );

      color:
        rgba(
          241,
          243,
          246,
          0.93
        );

      box-shadow:
        var(--shadow-soft),
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.065
        ),
        inset
        0
        -1px
        0
        rgba(
          0,
          0,
          0,
          0.13
        );

      backdrop-filter:
        blur(18px)
        saturate(125%);

      -webkit-backdrop-filter:
        blur(18px)
        saturate(125%);

      overflow: hidden;

      transition:
        transform 0.20s
          cubic-bezier(
            0.2,
            0.8,
            0.2,
            1
          ),
        border-color 0.20s ease,
        background 0.20s ease,
        box-shadow 0.20s ease;
    }

    .shortcut::before {
      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          115deg,
          rgba(
            255,
            255,
            255,
            0.085
          ),
          transparent 44%,
          rgba(
            255,
            255,
            255,
            0.035
          )
        );

      opacity: 0;

      transition:
        opacity 0.20s ease;

      pointer-events: none;
    }

    .shortcut:hover {
      transform:
        translateY(-3px);

      border-color:
        rgba(
          255,
          255,
          255,
          0.18
        );

      background:
        linear-gradient(
          135deg,
          rgba(
            255,
            255,
            255,
            0.105
          ),
          rgba(
            14,
            15,
            20,
            0.37
          ) 52%,
          rgba(
            255,
            255,
            255,
            0.06
          )
        );

      box-shadow:
        0
        15px
        38px
        rgba(
          0,
          0,
          0,
          0.30
        ),
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.08
        );
    }

    .shortcut:hover::before {
      opacity: 1;
    }

    .shortcut:active {
      transform:
        translateY(-1px)
        scale(0.975);
    }

    .shortcut svg {
      position: relative;

      z-index: 1;

      flex:
        0
        0
        auto;

      opacity: 0.84;

      transition:
        transform 0.20s ease,
        opacity 0.20s ease;
    }

    .shortcut:hover svg {
      transform:
        scale(1.06);

      opacity: 1;
    }

    .shortcut span {
      position: relative;

      z-index: 1;

      font-size: 11px;

      font-weight: 500;

      white-space: nowrap;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      flex:
        0
        0
        auto;

      margin-top: auto;

      padding-top: 12px;

      text-align: center;

      color:
        rgba(
          235,
          238,
          241,
          0.31
        );

      font-size: 9px;

      text-shadow:
        0
        2px
        10px
        rgba(
          0,
          0,
          0,
          0.4
        );
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {

      .shell {
        width:
          min(
            100% - 20px,
            1120px
          );

        padding:
          19px
          0
          16px;
      }

      .topbar {
        min-height: 36px;

        margin-bottom: 38px;
      }

      .weather-widget {
        top: -1px;

        max-width: 168px;
      }

      .hero {
        margin-bottom: 35px;
      }

      .time {
        font-size:
          clamp(
            57px,
            18vw,
            92px
          );
      }

      .date {
        font-size: 13px;
        margin-top: 14px;
      }

      .shortcuts {
        margin-top: 19px;
      }

      .shortcut {
        min-height: 42px;

        padding:
          0
          15px;
      }

      .shortcut span {
        font-size: 11px;
      }

      .wallpaper-shine {
        width: 75vw;
        height: 75vw;

        left: -15%;
        top: 5%;
      }
    }

    @media (max-width: 430px) {

      .weather-widget {
        max-width: 155px;

        padding:
          6px
          8px;
      }

      .weather-mini-condition {
        max-width: 65px;
      }

      .weather-mini-location {
        max-width: 110px;
      }

      .time {
        font-size:
          clamp(
            53px,
            18vw,
            82px
          );
      }

      .search input {
        height: 56px;
      }

      .shortcut-grid {
        gap: 8px;
      }

      .shortcut {
        padding:
          0
          14px;
      }
    }

    @media (max-height: 700px) {

      .shell {
        padding-top: 16px;
      }

      .topbar {
        margin-bottom: 27px;
      }

      .hero {
        margin-bottom: 25px;
      }

      .time {
        font-size:
          clamp(
            52px,
            13vw,
            90px
          );
      }

      .date {
        margin-top: 11px;
      }

      .shortcuts {
        margin-top: 14px;
      }

      footer {
        padding-top: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- =====================================================
         LOCAL GENERATED WALLPAPER
         ===================================================== -->

    <div
      class="wallpaper"
      aria-hidden="true"
    >

      <div
        class="wallpaper-image"
        id="wallpaperImage"
      ></div>

      <div class="wallpaper-overlay"></div>

      <div class="wallpaper-shine"></div>

      <div class="wallpaper-vignette"></div>

    </div>

    <div
      class="grain"
      aria-hidden="true"
    ></div>

    /* =========================================================

       Advantages:
       - Works offline.
       - Never depends on Unsplash.
       - No broken image URLs.
       - No CORS issues.
       - A random artwork is selected every page load.
       ========================================================= */

    const WALLPAPER_THEMES = [

      {

    function escapeXml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&apos;");
    }

    function createWallpaperSvg(theme) {
      const [
        colorOne,
        colorTwo,
        colorThree,
        colorFour
      ] = theme.colors;

      const shapes = theme.shapes;

      const svg = `
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 1600 1000"
          preserveAspectRatio="xMidYMid slice"
        >

          <defs>

            <linearGradient
              id="base"
              x1="0"
              y1="0"
              x2="1"
              y2="1"
            >
              <stop
                offset="0%"
                stop-color="${escapeXml(theme.background)}"
              />

              <stop
                offset="50%"
                stop-color="${escapeXml(colorFour)}"
              />

              <stop
                offset="100%"
                stop-color="#050608"
              />
            </linearGradient>

            <radialGradient
              id="one"
              cx="50%"
              cy="50%"
              r="50%"
            >
              <stop
                offset="0%"
                stop-color="${escapeXml(colorOne)}"
                stop-opacity=".60"
              />

              <stop
                offset="50%"
                stop-color="${escapeXml(colorOne)}"
                stop-opacity=".19"
              />

              <stop
                offset="100%"
                stop-color="${escapeXml(colorOne)}"
                stop-opacity="0"
              />
            </radialGradient>

            <radialGradient
              id="two"
              cx="50%"
              cy="50%"
              r="50%"
            >
              <stop
                offset="0%"
                stop-color="${escapeXml(colorTwo)}"
                stop-opacity=".58"
              />

              <stop
                offset="52%"
                stop-color="${escapeXml(colorTwo)}"
                stop-opacity=".16"
              />

              <stop
                offset="100%"
                stop-color="${escapeXml(colorTwo)}"
                stop-opacity="0"
              />
            </radialGradient>

            <radialGradient
              id="three"
              cx="50%"
              cy="50%"
              r="50%"
            >
              <stop
                offset="0%"
                stop-color="${escapeXml(colorThree)}"
                stop-opacity=".54"
              />

              <stop
                offset="54%"
                stop-color="${escapeXml(colorThree)}"
                stop-opacity=".14"
              />

              <stop
                offset="100%"
                stop-color="${escapeXml(colorThree)}"
                stop-opacity="0"
              />
            </radialGradient>

            <linearGradient
              id="shine"
              x1="0"
              y1="0"
              x2="1"
              y2="1"
            >
              <stop
                offset="0%"
                stop-color="#ffffff"
                stop-opacity="0"
              />

              <stop
                offset="48%"
                stop-color="#ffffff"
                stop-opacity=".045"
              />

              <stop
                offset="52%"
                stop-color="#ffffff"
                stop-opacity=".01"
              />

              <stop
                offset="100%"
                stop-color="#ffffff"
                stop-opacity="0"
              />
            </linearGradient>

            <filter
              id="blur"
              x="-30%"
              y="-30%"
              width="160%"
              height="160%"
            >
              <feGaussianBlur
                stdDeviation="40"
              />
            </filter>

            <filter
              id="blurSmall"
              x="-30%"
              y="-30%"
              width="160%"
              height="160%"
            >
              <feGaussianBlur
                stdDeviation="18"
              />
            </filter>

            <filter id="noise">
              <feTurbulence
                type="fractalNoise"
                baseFrequency=".72"
                numOctaves="2"
                stitchTiles="stitch"
              />

              <feColorMatrix
                type="saturate"
                values="0"
              />

              <feComponentTransfer>
                <feFuncA
                  type="table"
                  tableValues="0 .045"
                />
              </feComponentTransfer>
            </filter>

          </defs>

          <rect
            width="1600"
            height="1000"
            fill="url(#base)"
          />

          <circle
            cx="${shapes[0][0] * 16}"
            cy="${shapes[0][1] * 10}"
            r="${shapes[0][2] * 10}"
            fill="url(#one)"
            filter="url(#blur)"
          />

          <circle
            cx="${shapes[1][0] * 16}"
            cy="${shapes[1][1] * 10}"
            r="${shapes[1][2] * 10}"
            fill="url(#two)"
            filter="url(#blur)"
          />

          <circle
            cx="${shapes[2][0] * 16}"
            cy="${shapes[2][1] * 10}"
            r="${shapes[2][2] * 10}"
            fill="url(#three)"
            filter="url(#blur)"
          />

          <ellipse
            cx="820"
            cy="440"
            rx="440"
            ry="230"
            fill="url(#shine)"
            opacity=".34"
            filter="url(#blurSmall)"
            transform="rotate(-18 820 440)"
          />

          <rect
            width="1600"
            height="1000"
            filter="url(#noise)"
            opacity=".30"
          />

        </svg>
      `;

      return svg;
    }

    function setRandomWallpaper() {
      const wallpaper =
        $("wallpaperImage");

      if (!wallpaper) {
        return;
      }

      const index =
        Math.floor(
          Math.random() *
          WALLPAPER_THEMES.length
        );

      const theme =
        WALLPAPER_THEMES[index];

      const svg =
        createWallpaperSvg(theme);

      const dataUrl =
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg);

      wallpaper.style.backgroundImage =
        `url("${dataUrl}")`;

      requestAnimationFrame(() => {
        wallpaper.classList.add(
          "loaded"
        );
      });
    }

    setRandomWallpaper();

    /* =========================================================
       WEATHER
       ========================================================= */

    const WEATHER_CODES = {
      0: ["Clear sky", "☀️"],
      1: ["Mainly clear", "🌤️"],
      2: ["Partly cloudy", "⛅"],
      3: ["Overcast", "☁️"],

      45: ["Fog", "🌫️"],
      48: ["Rime fog", "🌫️"],

      51: ["Light drizzle", "🌦️"],
      53: ["Drizzle", "🌦️"],
      55: ["Heavy drizzle", "🌧️"],

      56: ["Freezing drizzle", "🌧️"],
      57: ["Heavy freezing drizzle", "🌧️"],

      61: ["Light rain", "🌦️"],
      63: ["Rain", "🌧️"],
      65: ["Heavy rain", "🌧️"],

      66: ["Freezing rain", "🌧️"],
      67: ["Heavy freezing rain", "🌧️"],

      71: ["Light snow", "🌨️"],
      73: ["Snow", "❄️"],
      75: ["Heavy snow", "❄️"],
      77: ["Snow grains", "❄️"],

      80: ["Light showers", "🌦️"],
      81: ["Showers", "🌧️"],
      82: ["Heavy showers", "⛈️"],

      85: ["Snow showers", "🌨️"],
      86: ["Heavy snow showers", "🌨️"],

      95: ["Thunderstorm", "⛈️"],
      96: ["Thunderstorm + hail", "⛈️"],
      99: ["Thunderstorm + hail", "⛈️"]
    };

    /* =========================================================
       GREETINGS
       ========================================================= */

    const GREETINGS = {
      night: [
        "Still up?",
        "Late-night mode.",
        "Good night.",
        "The world is quiet.",
        "Burning the midnight oil?",
        "One more thing before bed?"
      ],

      earlyMorning: [
        "Good morning.",
        "Morning.",
        "Rise and shine.",
        "A fresh start.",
        "New day, new start.",
        "Good morning, Zynx."
      ],

      morning: [
        "Good morning.",
        "Hope your morning is going well.",
        "Morning, Zynx.",
        "Ready for the day?",
        "Hope you're having a good start.",
        "A good morning to you."
      ],

      midday: [
        "Almost noon.",
        "Good afternoon.",
        "Midday already.",
        "Halfway through the day.",
        "How's your day going?",
        "Hope the day is going well."
      ],

      afternoon: [
        "Good afternoon.",
        "How's your afternoon?",
        "Hope your day is going well.",
        "Afternoon.",
        "Still plenty of day left.",
        "Hope you're having a good one."
      ],

      evening: [
        "Good evening.",
        "Evening.",
        "Hope you had a good day.",
        "A quiet evening.",
        "Time to slow down.",
        "Good to see you."
      ],

      lateEvening: [
        "Good evening.",
        "Winding down?",
        "Late evening.",
        "Still going strong?",
        "A calm night ahead.",
        "Almost time to call it a day."
      ]
    };

    function getGreeting(hour) {
      if (hour < 5) {
        return GREETINGS.night;
      }

      if (hour < 9) {
        return GREETINGS.earlyMorning;
      }

      if (hour < 12) {
        return GREETINGS.morning;
      }

      if (hour < 14) {
        return GREETINGS.midday;
      }

      if (hour < 18) {
        return GREETINGS.afternoon;
      }

      if (hour < 21) {
        return GREETINGS.evening;
      }

      return GREETINGS.lateEvening;
    }

    /* =========================================================
       CLOCK
       ========================================================= */

    function updateClock() {
      const now =
        new Date();

      const timeString =
        now.toLocaleTimeString(
          [],
          {
            hour: "numeric",
            minute: "2-digit",
            hour12: true
          }
        );

      const dateString =
        now.toLocaleDateString(
          [],
          {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        );

      const greetings =
        getGreeting(
          now.getHours()
        );

      const greetingIndex =
        (
          now.getDate() +
          now.getMonth() +
          now.getDay()
        ) %
        greetings.length;

      $("time").textContent =
        timeString;

      $("date").textContent =
        dateString;

      $("greeting").textContent =
        greetings[greetingIndex];

      document.title =
        `${timeString} · Home`;
    }

    updateClock();

    setInterval(
      updateClock,
      1000
    );

    /* =========================================================
       SEARCH
       ========================================================= */

    $("searchForm")
      .addEventListener(
        "submit",
        (event) => {
          event.preventDefault();

          const query =
            $("searchInput")
              .value
              .trim();

          if (!query) {
            return;
          }

          window.location.href =
            "https://www.google.com/search?q=" +
            encodeURIComponent(
              query
            );
        }
      );

    /* =========================================================
       REVERSE GEOCODING
       ========================================================= */

    async function reverseGeocode(
      latitude,
      longitude
    ) {
      const url =
        "https://api.bigdatacloud.net/data/reverse-geocode-client" +
        `?latitude=${encodeURIComponent(latitude)}` +
        `&longitude=${encodeURIComponent(longitude)}` +
        "&localityLanguage=en";

      try {
        const response =
          await fetch(url);

        if (!response.ok) {
          throw new Error(
            "Reverse geocoding failed."
          );
        }

        const data =
          await response.json();

        const name =
          data?.city ||
          data?.locality ||
          data?.principalSubdivision ||
          null;

        if (!name) {
          return null;
        }

        return {
          name,

          country:
            data?.countryName || ""
        };
      } catch {
        return null;
      }
    }

    /* =========================================================
       WEATHER API
       ========================================================= */

    async function fetchWeather(
      latitude,
      longitude
    ) {
      const params =
        new URLSearchParams({
          latitude,
          longitude,

          current:
            "temperature_2m," +
            "relative_humidity_2m," +
            "apparent_temperature," +
            "weather_code," +
            "wind_speed_10m",

          timezone:
            "auto",

          temperature_unit:
            "celsius",

          wind_speed_unit:
            "kmh"
        });

      const response =
        await fetch(
          "https://api.open-meteo.com/v1/forecast?" +
          params.toString()
        );

      if (!response.ok) {
        throw new Error(
          "Weather request failed."
        );
      }

      return response.json();
    }

    /* =========================================================
       RENDER WEATHER
       ========================================================= */

    function renderWeather(
      data,
      place
    ) {
      if (
        !data ||
        !data.current
      ) {
        throw new Error(
          "Invalid weather data."
        );
      }

      const current =
        data.current;

      const code =
        Number(
          current.weather_code
        );

      const info =
        WEATHER_CODES[code] ||
        ["Weather", "•"];

      $("weatherIcon")
        .textContent =
          info[1];

      $("temperature")
        .textContent =
          `${Math.round(
            Number(
              current.temperature_2m
            )
          )}°`;

      $("condition")
        .textContent =
          info[0];

      $("location")
        .textContent =
          place
            ? `${place.name}${
                place.country
                  ? `, ${place.country}`
                  : ""
              }`
            : "Your location";
    }

    /* =========================================================
       WEATHER LOADING
       ========================================================= */

    async function loadWeatherFromCoordinates(
      latitude,
      longitude,
      knownPlace = null
    ) {
      const [
        weather,
        place
      ] =
        await Promise.all([
          fetchWeather(
            latitude,
            longitude
          ),

          knownPlace
            ? Promise.resolve(
                knownPlace
              )
            : reverseGeocode(
                latitude,
                longitude
              )
        ]);

      renderWeather(
        weather,
        place
      );

      try {
        localStorage.setItem(
          "homeLocation",
          JSON.stringify({
            latitude,
            longitude,
            place
          })
        );
      } catch {
        // Storage is optional.
      }
    }

    async function loadWeather() {
      if (
        !("geolocation" in navigator)
      ) {
        throw new Error(
          "Geolocation unavailable."
        );
      }

      const position =
        await new Promise(
          (
            resolve,
            reject
          ) => {
            navigator.geolocation
              .getCurrentPosition(
                resolve,
                reject,
                {
                  enableHighAccuracy:
                    false,

                  timeout:
                    10000,

                  maximumAge:
                    900000
                }
              );
          }
        );

      const latitude =
        Number(
          position.coords.latitude
        );

      const longitude =
        Number(
          position.coords.longitude
        );

      await loadWeatherFromCoordinates(
        latitude,
        longitude
      );
    }

    /* =========================================================
       SAVED LOCATION
       ========================================================= */

    async function loadSavedWeather() {
      let saved = null;

      try {
        saved =
          localStorage.getItem(
            "homeLocation"
          );
      } catch {
        return false;
      }

      if (!saved) {
        return false;
      }

      try {
        const location =
          JSON.parse(saved);

        if (
          typeof location?.latitude !==
            "number" ||
          typeof location?.longitude !==
            "number"
        ) {
          return false;
        }

        await loadWeatherFromCoordinates(
          location.latitude,
          location.longitude,
          location.place || null
        );

        return true;
      } catch {
        return false;
      }
    }

    /* =========================================================
       START WEATHER
       ========================================================= */

    async function startWeather() {
      const restored =
        await loadSavedWeather();

      if (restored) {
        return;
      }

      try {
        await loadWeather();
      } catch {
        $("location")
          .textContent =
            "Tap to enable location";

        $("condition")
          .textContent =
            "Location required";
      }
    }

    /* =========================================================
       REFRESH WEATHER
       ========================================================= */

    $("location")
      .addEventListener(
        "click",
        async () => {

          const previous =
            $("location")
              .textContent;

          $("location")
            .textContent =
              "Refreshing…";

          try {
            await loadWeather();
          } catch {
            $("location")
              .textContent =
                previous ||
                "Location unavailable";
          }
        }
      );

    startWeather();

  </script>

</body>
</html>
