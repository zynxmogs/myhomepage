<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#06070a">
  <meta
    name="description"
    content="A minimal dark personal homepage with time, weather, football news and glass shortcuts."
  >
  <title>Home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      color-scheme: dark;

      --bg: #06070a;
      --text: #f4f5f7;
      --muted: #9ea4ad;
      --subtle: #7d838d;

      --border: rgba(255, 255, 255, 0.105);
      --glass: rgba(255, 255, 255, 0.055);
      --glass-hover: rgba(255, 255, 255, 0.08);

      --blue: #6683ff;
      --purple: #a36cff;
      --cyan: #42c8cf;
      --pink: #ff6aa9;

      --shadow: 0 24px 75px rgba(0, 0, 0, 0.42);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(84, 92, 160, 0.055),
          transparent 35%
        ),
        var(--bg);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================================
       BACKGROUND
       ========================================================= */

    .background {
      position: fixed;
      inset: 0;
      z-index: -10;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(255, 255, 255, 0.012),
          transparent 58%
        );
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      will-change: transform, opacity;
      transform: translate3d(0, 0, 0);
      filter: blur(82px);
    }

    .orb-1 {
      width: 430px;
      height: 430px;
      left: -120px;
      top: -100px;
      background:
        radial-gradient(
          circle,
          rgba(79, 107, 255, 0.30) 0%,
          rgba(79, 107, 255, 0.12) 34%,
          transparent 72%
        );
      animation:
        floatOne 17s ease-in-out infinite alternate,
        glowOne 8s ease-in-out infinite;
    }

    .orb-2 {
      width: 390px;
      height: 390px;
      right: -110px;
      top: 80px;
      background:
        radial-gradient(
          circle,
          rgba(157, 84, 255, 0.26) 0%,
          rgba(157, 84, 255, 0.09) 36%,
          transparent 73%
        );
      animation:
        floatTwo 21s ease-in-out infinite alternate,
        glowTwo 10s ease-in-out infinite;
    }

    .orb-3 {
      width: 420px;
      height: 420px;
      left: 24%;
      bottom: -260px;
      background:
        radial-gradient(
          circle,
          rgba(42, 200, 207, 0.20) 0%,
          rgba(42, 200, 207, 0.065) 38%,
          transparent 72%
        );
      animation:
        floatThree 25s ease-in-out infinite alternate,
        glowThree 12s ease-in-out infinite;
    }

    .orb-4 {
      width: 290px;
      height: 290px;
      right: 14%;
      bottom: 8%;
      background:
        radial-gradient(
          circle,
          rgba(255, 87, 155, 0.15) 0%,
          rgba(255, 87, 155, 0.045) 40%,
          transparent 73%
        );
      animation: floatFour 20s ease-in-out infinite alternate;
    }

    .orb-5 {
      width: 270px;
      height: 270px;
      left: 40%;
      top: 30%;
      background:
        radial-gradient(
          circle,
          rgba(70, 114, 255, 0.11) 0%,
          rgba(70, 114, 255, 0.025) 45%,
          transparent 75%
        );
      animation: floatFive 27s ease-in-out infinite alternate;
    }

    .color-wash {
      position: absolute;
      inset: -30%;
      background:
        conic-gradient(
          from 0deg at 50% 50%,
          rgba(69, 105, 255, 0.035),
          rgba(162, 87, 255, 0.04),
          rgba(48, 196, 203, 0.03),
          rgba(255, 87, 155, 0.022),
          rgba(69, 105, 255, 0.035)
        );
      filter: blur(75px);
      animation: slowRotate 38s linear infinite;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          ellipse at center,
          transparent 28%,
          rgba(2, 3, 6, 0.22) 100%
        );
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: -9;
      pointer-events: none;
      opacity: 0.026;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.8'/%3E%3C/svg%3E");
    }

    @keyframes floatOne {
      0% {
        transform: translate3d(-20px, -10px, 0) scale(0.95);
      }
      35% {
        transform: translate3d(55px, 25px, 0) scale(1.07);
      }
      70% {
        transform: translate3d(95px, 85px, 0) scale(1.13);
      }
      100% {
        transform: translate3d(40px, 130px, 0) scale(1.02);
      }
    }

    @keyframes floatTwo {
      0% {
        transform: translate3d(25px, -10px, 0) scale(1);
      }
      35% {
        transform: translate3d(-55px, 45px, 0) scale(1.08);
      }
      70% {
        transform: translate3d(-105px, 95px, 0) scale(0.95);
      }
      100% {
        transform: translate3d(-40px, 135px, 0) scale(1.05);
      }
    }

    @keyframes floatThree {
      0% {
        transform: translate3d(-55px, 20px, 0) scale(0.96);
      }
      40% {
        transform: translate3d(30px, -70px, 0) scale(1.08);
      }
      75% {
        transform: translate3d(110px, -10px, 0) scale(1.13);
      }
      100% {
        transform: translate3d(170px, 60px, 0) scale(1);
      }
    }

    @keyframes floatFour {
      0% {
        transform: translate3d(0, 0, 0) scale(0.92);
      }
      45% {
        transform: translate3d(-70px, -45px, 0) scale(1.08);
      }
      100% {
        transform: translate3d(50px, 55px, 0) scale(0.98);
      }
    }

    @keyframes floatFive {
      0% {
        transform: translate3d(-40px, 25px, 0) scale(0.92);
      }
      50% {
        transform: translate3d(55px, -40px, 0) scale(1.12);
      }
      100% {
        transform: translate3d(100px, 70px, 0) scale(0.98);
      }
    }

    @keyframes glowOne {
      0%, 100% {
        opacity: 0.68;
      }
      50% {
        opacity: 1;
      }
    }

    @keyframes glowTwo {
      0%, 100% {
        opacity: 0.62;
      }
      50% {
        opacity: 0.95;
      }
    }

    @keyframes glowThree {
      0%, 100% {
        opacity: 0.58;
      }
      50% {
        opacity: 0.9;
      }
    }

    @keyframes slowRotate {
      from {
        transform: rotate(0deg) scale(1);
      }
      to {
        transform: rotate(360deg) scale(1.08);
      }
    }

    /* =========================================================
       LAYOUT
       ========================================================= */

    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 36px;
    }

    .topbar {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 64px;
    }

    .brand {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.78);
    }

    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      text-align: center;
      margin: 0 auto 56px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 12px;
      min-height: 20px;
      transition: opacity 0.35s ease;
    }

    .time {
      font-size: clamp(66px, 13vw, 148px);
      line-height: 0.9;
      letter-spacing: -0.075em;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin-left: -0.075em;
      text-shadow:
        0 0 30px rgba(108, 125, 255, 0.045),
        0 0 70px rgba(140, 85, 255, 0.025);
    }

    .date {
      margin-top: 18px;
      color: var(--muted);
      font-size: 15px;
      letter-spacing: 0.01em;
    }

    /* =========================================================
       SEARCH
       ========================================================= */

    .search {
      width: min(720px, 100%);
      margin: 0 auto;
      position: relative;
    }

    .search input {
      width: 100%;
      height: 58px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.105);
      background:
        linear-gradient(
          135deg,
          rgba(105, 126, 255, 0.055),
          rgba(255,255,255,0.035) 45%,
          rgba(170, 91, 255, 0.035)
        );
      color: var(--text);
      outline: none;
      padding: 0 56px 0 20px;
      box-shadow:
        0 16px 50px rgba(0, 0, 0, 0.18),
        inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(20px) saturate(125%);
      -webkit-backdrop-filter: blur(20px) saturate(125%);
      transition:
        border-color 0.22s ease,
        background 0.22s ease,
        box-shadow 0.22s ease,
        transform 0.22s ease;
    }

    .search input::placeholder {
      color: #777d87;
    }

    .search input:focus {
      border-color: rgba(113, 132, 255, 0.26);
      background:
        linear-gradient(
          135deg,
          rgba(105, 126, 255, 0.075),
          rgba(255,255,255,0.05) 45%,
          rgba(170, 91, 255, 0.05)
        );
      box-shadow:
        0 18px 54px rgba(0, 0, 0, 0.22),
        0 0 0 4px rgba(89, 111, 255, 0.035),
        0 0 30px rgba(77, 104, 255, 0.06);
      transform: translateY(-1px);
    }

    .search-icon {
      position: absolute;
      right: 19px;
      top: 50%;
      transform: translateY(-50%);
      color: #8e949e;
      pointer-events: none;
    }

    /* =========================================================
       CARDS
       ========================================================= */

    .grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 18px;
    }

    .card {
      position: relative;
      border: 1px solid var(--border);
      background:
        linear-gradient(
          135deg,
          rgba(91, 116, 255, 0.06),
          rgba(255,255,255,0.045) 42%,
          rgba(159, 79, 255, 0.035)
        );
      border-radius: var(--radius);
      box-shadow:
        var(--shadow),
        inset 0 1px 0 rgba(255,255,255,0.045);
      backdrop-filter: blur(24px) saturate(130%);
      -webkit-backdrop-filter: blur(24px) saturate(130%);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          120deg,
          rgba(92, 118, 255, 0.035),
          transparent 35%,
          rgba(205, 111, 255, 0.025) 72%,
          transparent
        );
    }

    .card-head {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 21px 22px 12px;
    }

    .label {
      font-size: 12px;
      font-weight: 600;
      color: #b2b7c0;
      text-transform: uppercase;
      letter-spacing: 0.11em;
    }

    .location {
      color: #7f8690;
      font-size: 11px;
      max-width: 55%;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================================================
       WEATHER
       ========================================================= */

    .weather {
      position: relative;
      z-index: 1;
      padding: 8px 22px 22px;
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .weather-icon {
      width: 54px;
      text-align: center;
      font-size: 44px;
      filter: drop-shadow(0 8px 22px rgba(104, 123, 255, 0.12));
    }

    .temp {
      font-size: 44px;
      line-height: 1;
      font-weight: 500;
      letter-spacing: -0.06em;
      font-variant-numeric: tabular-nums;
    }

    .condition {
      color: var(--muted);
      font-size: 13px;
      margin-top: 5px;
    }

    .weather-meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 22px;
    }

    .meta-box {
      border-radius: 14px;
      padding: 12px;
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.045),
          rgba(92,116,255,0.025)
        );
      border: 1px solid rgba(255,255,255,0.055);
    }

    .meta-box .k {
      font-size: 10px;
      color: #777e89;
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    .meta-box .v {
      margin-top: 5px;
      font-size: 13px;
      color: #d7dae0;
      font-variant-numeric: tabular-nums;
    }

    /* =========================================================
       NEWS
       ========================================================= */

    .news-list {
      position: relative;
      z-index: 1;
      padding: 6px 12px 12px;
    }

    .news-item {
      display: block;
      padding: 14px 10px;
      border-radius: 15px;
      transition:
        background 0.2s ease,
        transform 0.2s ease,
        border-color 0.2s ease;
      border: 1px solid transparent;
    }

    .news-item:hover {
      background:
        linear-gradient(
          135deg,
          rgba(96, 122, 255, 0.065),
          rgba(170, 90, 255, 0.045)
        );
      border-color: rgba(113, 132, 255, 0.08);
      transform: translateY(-1px);
    }

    .news-title {
      font-size: 14px;
      line-height: 1.45;
      color: #e8e9ec;
    }

    .news-meta {
      display: flex;
      gap: 8px;
      margin-top: 7px;
      font-size: 10px;
      color: #797f89;
    }

    .news-empty {
      padding: 22px 10px 26px;
      color: #858b95;
      font-size: 13px;
      line-height: 1.5;
    }

    .news-empty a {
      color: #9aa8ff;
    }

    /* =========================================================
       SHORTCUTS
       ========================================================= */

    .shortcuts {
      margin-top: 18px;
    }

    .shortcuts-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 2px 12px;
    }

    .shortcut-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
    }

    .shortcut {
      min-width: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 58px;
      padding: 12px 10px;
      border-radius: 17px;
      border: 1px solid rgba(255,255,255,0.085);
      background:
        linear-gradient(
          145deg,
          rgba(100, 120, 255, 0.07),
          rgba(255,255,255,0.035) 45%,
          rgba(173, 91, 255, 0.045)
        );
      color: #e2e4e8;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.045),
        0 10px 30px rgba(0,0,0,0.16);
      backdrop-filter: blur(20px) saturate(130%);
      -webkit-backdrop-filter: blur(20px) saturate(130%);
      transition:
        transform 0.18s ease,
        background 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .shortcut::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 16px;
      pointer-events: none;
      opacity: 0;
      background:
        linear-gradient(
          120deg,
          rgba(103, 127, 255, 0.14),
          transparent 40%,
          rgba(175, 94, 255, 0.10)
        );
      transition: opacity 0.18s ease;
    }

    .shortcut:hover {
      transform: translateY(-2px);
      background:
        linear-gradient(
          145deg,
          rgba(100, 120, 255, 0.10),
          rgba(255,255,255,0.055) 45%,
          rgba(173, 91, 255, 0.075)
        );
      border-color: rgba(128, 143, 255, 0.18);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.055),
        0 13px 32px rgba(0,0,0,0.2),
        0 0 28px rgba(94, 115, 255, 0.045);
    }

    .shortcut:hover::after {
      opacity: 1;
    }

    .shortcut:active {
      transform: scale(0.98);
    }

    .shortcut svg {
      position: relative;
      z-index: 1;
      flex: 0 0 auto;
      opacity: 0.9;
    }

    .shortcut span {
      position: relative;
      z-index: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 500;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      text-align: center;
      color: #666c75;
      font-size: 11px;
      margin-top: 34px;
    }

    .location-prompt {
      cursor: pointer;
    }

    .location-prompt:hover {
      color: #a9afb7;
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 820px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .shortcut-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .topbar {
        margin-bottom: 50px;
      }

      .orb-1 {
        width: 360px;
        height: 360px;
      }

      .orb-2 {
        width: 330px;
        height: 330px;
      }

      .orb-3 {
        width: 350px;
        height: 350px;
      }
    }

    @media (max-width: 520px) {
      .shell {
        width: min(100% - 20px, 1120px);
        padding-top: 20px;
      }

      .topbar {
        margin-bottom: 40px;
      }

      .hero {
        margin-bottom: 40px;
      }

      .time {
        font-size: clamp(58px, 19vw, 92px);
      }

      .date {
        font-size: 13px;
      }

      .weather-meta {
        grid-template-columns: repeat(3, 1fr);
      }

      .shortcut-grid {
        gap: 9px;
      }

      .shortcut {
        min-height: 56px;
        padding: 10px 7px;
      }

      .shortcut span {
        font-size: 11px;
      }

      .orb-1 {
        left: -180px;
        top: -90px;
      }

      .orb-2 {
        right: -170px;
        top: 80px;
      }

      .orb-3 {
        left: 5%;
        bottom: -230px;
      }

      .orb-4 {
        right: -60px;
        bottom: 10%;
      }

      .orb-5 {
        left: 30%;
        top: 38%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       BACKGROUND
       ========================================================= -->

  <div class="background" aria-hidden="true">
    <div class="color-wash"></div>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="orb orb-5"></div>

    <div class="vignette"></div>
  </div>

  <div class="grain" aria-hidden="true"></div>

  <main class="shell">

    <!-- =======================================================
         TOP BAR
         ======================================================= -->

    <header class="topbar">
      <div class="brand">HOME</div>
    </header>

    <!-- =======================================================
         HERO
         ======================================================= -->

    <section class="hero" aria-label="Welcome">

      <div
        class="eyebrow"
        id="greeting"
      >
        Welcome.
      </div>

      <div
        class="time"
        id="time"
      >
        --:--
      </div>

      <div
        class="date"
        id="date"
      >
        Loading date…
      </div>

    </section>

    <!-- =======================================================
         SEARCH
         ======================================================= -->

    <form
      class="search"
      id="searchForm"
      role="search"
    >
      <input
        id="searchInput"
        type="search"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web…"
        aria-label="Search the web"
      >

      <span
        class="search-icon"
        aria-hidden="true"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
        >
          <circle
            cx="11"
            cy="11"
            r="6.7"
          ></circle>

          <path d="m16 16 5 5"></path>
        </svg>
      </span>
    </form>

    <!-- =======================================================
         WEATHER + FOOTBALL
         ======================================================= -->

    <section
      class="grid"
      style="margin-top:18px"
    >

      <!-- WEATHER -->
      <article
        class="card"
        aria-label="Weather"
      >

        <div class="card-head">

          <div class="label">
            Weather
          </div>

          <div
            id="location"
            class="location location-prompt"
            title="Tap to set location"
          >
            Detecting location…
          </div>

        </div>

        <div class="weather">

          <div class="weather-main">

            <div
              class="weather-icon"
              id="weatherIcon"
              aria-hidden="true"
            >
              —
            </div>

            <div>

              <div
                class="temp"

  <script>
    "use strict";

    /* =========================================================
       HELPERS
       ========================================================= */

    const $ = (id) => document.getElementById(id);

    const state = {
      weather: null,
      location: null
    };

    /* =========================================================
       WEATHER CODES
       ========================================================= */

    const WEATHER_CODES = {
      0: ["Clear sky", "☀️"],
      1: ["Mainly clear", "🌤️"],
      2: ["Partly cloudy", "⛅"],
      3: ["Overcast", "☁️"],

      45: ["Fog", "🌫️"],
      48: ["Rime fog", "🌫️"],

      51: ["Light drizzle", "🌦️"],
      53: ["Drizzle", "🌦️"],
      55: ["Heavy drizzle", "🌧️"],

      56: ["Freezing drizzle", "🌧️"],
      57: ["Heavy freezing drizzle", "🌧️"],

      61: ["Light rain", "🌦️"],
      63: ["Rain", "🌧️"],
      65: ["Heavy rain", "🌧️"],

      66: ["Freezing rain", "🌧️"],
      67: ["Heavy freezing rain", "🌧️"],

      71: ["Light snow", "🌨️"],
      73: ["Snow", "❄️"],
      75: ["Heavy snow", "❄️"],
      77: ["Snow grains", "❄️"],

      80: ["Light showers", "🌦️"],
      81: ["Showers", "🌧️"],
      82: ["Heavy showers", "⛈️"],

      85: ["Snow showers", "🌨️"],
      86: ["Heavy snow showers", "🌨️"],

      95: ["Thunderstorm", "⛈️"],
      96: ["Thunderstorm + hail", "⛈️"],
      99: ["Thunderstorm + hail", "⛈️"]
    };

    /* =========================================================
       GREETINGS
       ========================================================= */

    const GREETINGS = {
      night: [
        "Still up?",
        "Late-night mode.",
        "Good night.",
        "Burning the midnight oil?",
        "The world is quiet.",
        "One more thing before bed?"
      ],

      earlyMorning: [
        "Good morning.",
        "Morning.",
        "Rise and shine.",
        "A fresh start.",
        "New day, new start.",
        "Good morning, Zynx."
      ],

      morning: [
        "Good morning.",
        "Hope your morning is going well.",
        "Morning, Zynx.",
        "A good morning to you.",
        "Ready for the day?",
        "Hope you're having a good start."
      ],

      midday: [
        "Almost noon.",
        "Good afternoon.",
        "Midday already.",
        "Hope the day is going well.",
        "Halfway through the day.",
        "How's your day going?"
      ],

      afternoon: [
        "Good afternoon.",
        "How's your afternoon?",
        "Hope your day is going well.",
        "Afternoon.",
        "Still plenty of day left.",
        "Hope you're having a good one."
      ],

      evening: [
        "Good evening.",
        "Evening.",
        "Hope you had a good day.",
        "A quiet evening.",
        "Time to slow down.",
        "Good to see you."
      ],

      lateEvening: [
        "Good evening.",
        "Winding down?",
        "Late evening.",
        "Still going strong?",
        "A calm night ahead.",
        "Almost time to call it a day."
      ]
    };

    function getGreeting(hour) {
      if (hour < 5) {
        return GREETINGS.night;
      }

      if (hour < 9) {
        return GREETINGS.earlyMorning;
      }

      if (hour < 12) {
        return GREETINGS.morning;
      }

      if (hour < 14) {
        return GREETINGS.midday;
      }

      if (hour < 18) {
        return GREETINGS.afternoon;
      }

      if (hour < 21) {
        return GREETINGS.evening;
      }

      return GREETINGS.lateEvening;
    }

    /* =========================================================
       CLOCK
       ========================================================= */

    function updateClock() {
      const now = new Date();

      const timeString = now.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      });

      const dateString = now.toLocaleDateString([], {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });

      const greetings = getGreeting(now.getHours());

      const greetingIndex =
        (now.getDate() +
          now.getMonth() +
          now.getDay()) %
        greetings.length;

      $("time").textContent = timeString;
      $("date").textContent = dateString;
      $("greeting").textContent = greetings[greetingIndex];

      document.title = `${timeString} · Home`;
    }

    updateClock();
    setInterval(updateClock, 1000);

    /* =========================================================
       SEARCH
       ========================================================= */

    $("searchForm").addEventListener("submit", (event) => {
      event.preventDefault();

      const query = $("searchInput").value.trim();

      if (!query) {
        return;
      }

      window.location.href =
        `https://www.google.com/search?q=${encodeURIComponent(query)}`;
    });

    /* =========================================================
       REVERSE GEOCODING
       ========================================================= */

    async function reverseGeocode(latitude, longitude) {
      const url =
        "https://api.bigdatacloud.net/data/reverse-geocode-client" +
        `?latitude=${encodeURIComponent(latitude)}` +
        `&longitude=${encodeURIComponent(longitude)}` +
        "&localityLanguage=en";

      try {
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("Reverse geocoding failed.");
        }

        const data = await response.json();

        const name =
          data?.city ||
          data?.locality ||
          data?.principalSubdivision ||
          null;

        if (!name) {
          return null;
        }

        return {
          name,
          country: data?.countryName || ""
        };
      } catch (error) {
        return null;
      }
    }

    /* =========================================================
       WEATHER
       ========================================================= */

    async function fetchWeather(latitude, longitude) {
      const params = new URLSearchParams({
        latitude: latitude,
        longitude: longitude,
        current:
          "temperature_2m," +
          "relative_humidity_2m," +
          "apparent_temperature," +
          "weather_code," +
          "wind_speed_10m",
        timezone: "auto",
        temperature_unit: "celsius",
        wind_speed_unit: "kmh"
      });

      const response = await fetch(
        `https://api.open-meteo.com/v1/forecast?${params.toString()}`
      );

      if (!response.ok) {
        throw new Error("Weather request failed.");
      }

      return response.json();
    }

    function renderWeather(data, place) {
      if (!data || !data.current) {
        throw new Error("Invalid weather data.");
      }

      const current = data.current;

      const code = Number(current.weather_code);

      const info =
        WEATHER_CODES[code] ||
        ["Weather", "•"];

      $("weatherIcon").textContent = info[1];

      $("temperature").textContent =
        `${Math.round(Number(current.temperature_2m))}°`;

      $("condition").textContent = info[0];

      $("feels").textContent =
        `${Math.round(Number(current.apparent_temperature))}°`;

      $("wind").textContent =
        `${Math.round(Number(current.wind_speed_10m))} km/h`;

      $("humidity").textContent =
        `${Math.round(Number(current.relative_humidity_2m))}%`;

      $("location").textContent =
        place
          ? `${place.name}${place.country ? `, ${place.country}` : ""}`
          : "Your location";

      $("location").title = "Refresh location";

      state.weather = data;
    }

    async function loadWeatherFromCoordinates(
      latitude,
      longitude,
      place = null
    ) {
      const [weather, resolvedPlace] =
        await Promise.all([
          fetchWeather(latitude, longitude),
          place
            ? Promise.resolve(place)
            : reverseGeocode(latitude, longitude)
        ]);

      const finalPlace =
        resolvedPlace || place || null;

      renderWeather(weather, finalPlace);

      state.location = {
        latitude,
        longitude,
        place: finalPlace
      };

      try {
        localStorage.setItem(
          "homeLocation",
          JSON.stringify(state.location)
        );
      } catch (error) {
        // Storage may be unavailable in some browser modes.
      }
    }

    async function loadWeather() {
      if (!("geolocation" in navigator)) {
        throw new Error("Geolocation unavailable.");
      }

      const position =
        await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(
            resolve,
            reject,
            {
              enableHighAccuracy: false,
              timeout: 10000,
              maximumAge: 900000
            }
          );
        });

      const latitude =
        Number(position.coords.latitude);

      const longitude =
        Number(position.coords.longitude);

      await loadWeatherFromCoordinates(
        latitude,
        longitude
      );
    }

    async function loadSavedWeather() {
      let saved = null;

      try {
        saved =
          localStorage.getItem("homeLocation");
      } catch (error) {
        return false;
      }

      if (!saved) {
        return false;
      }

      try {
        const location =
          JSON.parse(saved);

        if (
          typeof location?.latitude !== "number" ||
          typeof location?.longitude !== "number"
        ) {
          return false;
        }

        await loadWeatherFromCoordinates(
          location.latitude,
          location.longitude,
          location.place || null
        );

        return true;
      } catch (error) {
        return false;
      }
    }

    async function startWeather() {
      try {
        const restored =
          await loadSavedWeather();

        if (restored) {
          return;
        }

        $("location").textContent =
          "Detecting location…";

        await loadWeather();
      } catch (error) {
        $("location").textContent =
          "Tap to enable location";

        $("condition").textContent =
          "Weather needs location access.";
      }
    }

    $("location").addEventListener(
      "click",
      async () => {
        $("location").textContent =
          "Refreshing…";

        try {
          await loadWeather();
        } catch (error) {
          $("location").textContent =
            "Location unavailable";
        }
      }
    );

    startWeather();

    /* =========================================================
       FOOTBALL NEWS
       =========================================================

       Indian football/ISL terms are explicitly excluded.
       The feed focuses on international football.
       ========================================================= */

    const FOOTBALL_RSS =
      "https://news.google.com/rss/search" +
      "?q=football" +
      "+-India" +
      "+-Indian" +
      "+-ISL" +
      "+-\"Indian%20Super%20League\"" +
      "+-\"Indian%20football\"" +
      "+-\"Indian%20football%20league\"" +
      "+-\"I-League\"" +
      "+when%3A2d" +
      "&hl=en-US" +
      "&gl=US" +
      "&ceid=US:en";

    const RSS_PROXY =
      "https://api.rss2json.com/v1/api.json?rss_url=";

    /* =========================================================
       SAFE TEXT
       ========================================================= */

    function safeText(value) {
      const node =
        document.createElement("div");

      node.textContent = value || "";

      return node.textContent
        .replace(/\s+/g, " ")
        .trim();
    }

    /* =========================================================
       INDIAN FOOTBALL FILTER
       ========================================================= */

    const INDIAN_FOOTBALL_TERMS = [
      "isl",
      "indian super league",
      "i-league",
      "i league",
      "indian football",
      "india football",
      "indian football league",
      "super league",
      "durand cup",
      "santosh trophy",
      "mohun bagan",
      "mohunbagan",
      "east bengal",
      "bengaluru fc",
      "fc goa",
      "kerala blasters",
      "mumbai city fc",
      "hyderabad fc",
      "odisha fc",
      "punjab fc",
      "jamshedpur fc",
      "chennaiyin fc",
      "northeast united",
      "north east united",
      "minerva punjab",
      "real kashmir",
      "gokulam kerala",
      "aizawl fc",
      "inter kashi",
      "delhi fc",
      "sreenidi deccan"
    ];

    function isIndianFootballStory(item) {
      const title =
        safeText(item?.title).toLowerCase();

      const description =
        safeText(item?.description).toLowerCase();

      const combined =
        `${title} ${description}`;

      return INDIAN_FOOTBALL_TERMS.some(
        (term) =>
          combined.includes(term)
      );
    }

    /* =========================================================
       NEWS LINK VALIDATION
       ========================================================= */

    function safeNewsUrl(rawUrl, fallbackTitle) {
      try {
        const url =
          new URL(
            rawUrl ||
              `https://news.google.com/search?q=${encodeURIComponent(fallbackTitle)}`
          );

        if (
          url.protocol !== "http:" &&
          url.protocol !== "https:"
        ) {
          throw new Error("Unsupported URL.");
        }

        return url.href;
      } catch (error) {
        return (
          "https://news.google.com/search?q=" +
          encodeURIComponent(fallbackTitle)
        );
      }
    }

    /* =========================================================
       NEWS RENDER
       ========================================================= */

    function createNewsItem(item) {
      const title =
        safeText(item?.title);

      if (!title) {
        return null;
      }

      const link =
        safeNewsUrl(
          item?.link,
          title
        );

      const source =
        safeText(
          item?.author ||
          item?.source ||
          "Football"
        ).slice(0, 40) ||
        "Football";

      const published =
        item?.pubDate
          ? new Date(item.pubDate)
          : null;

      const validDate =
        published &&
        !Number.isNaN(
          published.getTime()
        );

      const dateText =
        validDate
          ? published.toLocaleDateString(
              [],
              {
                day: "numeric",
                month: "short"
              }
            )
          : "";

      const article =
        document.createElement("a");

      article.className =
        "news-item";

      article.href = link;
      article.target = "_blank";
      article.rel =
        "noopener noreferrer";

      const titleElement =
        document.createElement("div");

      titleElement.className =
        "news-title";

      titleElement.textContent =
        title;

      const meta =
        document.createElement("div");

      meta.className =
        "news-meta";

      const sourceElement =
        document.createElement("span");

      sourceElement.textContent =
        source;

      meta.appendChild(
        sourceElement
      );

      if (dateText) {
        const separator =
          document.createElement("span");

        separator.textContent = "·";

        const dateElement =
          document.createElement("span");

        dateElement.textContent =
          dateText;

        meta.appendChild(
          separator
        );

        meta.appendChild(
          dateElement
        );
      }

      article.appendChild(
        titleElement
      );

      article.appendChild(
        meta
      );

      return article;
    }

    function renderNews(items) {
      const newsList =
        $("newsList");

      newsList.innerHTML = "";

      const validItems =
        Array.isArray(items)
          ? items
              .filter(
                (item) =>
                  item &&
                  !isIndianFootballStory(item)
              )
              .slice(0, 5)
          : [];

      validItems.forEach(
        (item) => {
          const element =
            createNewsItem(item);

          if (element) {
            newsList.appendChild(
              element
            );
          }
        }
      );

      if (!newsList.children.length) {
        const empty =
          document.createElement("div");

        empty.className =
          "news-empty";

        empty.innerHTML =
          'No international football headlines are available right now. <a href="https://news.google.com/search?q=football%20-%22Indian%20Super%20League%22%20-ISL%20-India" target="_blank" rel="noopener noreferrer">Open football news ↗</a>';

        newsList.appendChild(
          empty
        );
      }
    }

    /* =========================================================
       LOAD NEWS
       ========================================================= */

    async function loadNews() {
      try {
        const response =
          await fetch(
            RSS_PROXY +
              encodeURIComponent(
                FOOTBALL_RSS
              ),
            {
              cache: "no-store"
            }
          );

        if (!response.ok) {
          throw new Error(
            "News request failed."
          );
        }

        const data =
          await response.json();

        if (
          data?.status !== "ok" ||
          !Array.isArray(data?.items)
        ) {
          throw new Error(
            "Invalid news feed."
          );
        }

        renderNews(
          data.items
        );
      } catch (error) {
        $("newsList").innerHTML = `
          <div class="news-empty">
            Live headlines couldn't be loaded here.
            <a
              href="https://news.google.com/search?q=football%20-%22Indian%20Super%20League%22%20-ISL%20-India"
              target="_blank"
              rel="noopener noreferrer"
            >
              Open football news ↗
            </a>
          </div>
        `;
      }
    }

    loadNews();

    setInterval(
      loadNews,
      15 * 60 * 1000
    );
  </script>
