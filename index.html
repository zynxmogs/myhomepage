<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#06070a"
  >

  <meta
    name="description"
    content="Minimal liquid glass personal homepage."
  >

  <title>Home</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      color-scheme: dark;

      --text: #f6f7f8;
      --muted: rgba(245, 247, 249, 0.66);
      --soft: rgba(245, 247, 249, 0.46);

      --glass-border: rgba(255, 255, 255, 0.12);

      --shadow:
        0 20px 65px rgba(0, 0, 0, 0.38),
        0 5px 25px rgba(0, 0, 0, 0.20);

      --shadow-soft:
        0 12px 35px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;

      margin: 0;
      padding: 0;

      background: #06070a;
    }

    html {
      overflow: hidden;
    }

    body {
      overflow: hidden;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;

      overscroll-behavior: none;
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================================
       APP
       ========================================================= */

    .app {
      position: relative;

      width: 100%;
      height: 100dvh;
      min-height: 100dvh;

      overflow: hidden;

      isolation: isolate;
    }

    /* =========================================================
       WALLPAPER
       ========================================================= */

    .wallpaper {
      position: fixed;
      inset: 0;

      z-index: -20;

      overflow: hidden;

      background: #08090d;
    }

    .wallpaper-image {
      position: absolute;
      inset: -3%;

      width: 106%;
      height: 106%;

      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;

      /*
        A default image is already present here.
        JavaScript replaces it with a random one.
      */
      background-image:
        url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=2400&q=85");

      transform: scale(1.045);

      filter:
        brightness(0.52)
        saturate(0.78)
        contrast(1.03);

      will-change: transform;

      animation:
        wallpaperFloat 18s ease-in-out
        infinite alternate;
    }

    .wallpaper-overlay {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          180deg,
          rgba(3, 4, 7, 0.56) 0%,
          rgba(3, 4, 7, 0.25) 38%,
          rgba(3, 4, 7, 0.45) 100%
        );
    }

    .wallpaper-overlay::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.18),
          transparent 30%,
          transparent 70%,
          rgba(0, 0, 0, 0.18)
        );
    }

    .wallpaper-vignette {
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          ellipse at center,
          transparent 28%,
          rgba(0, 0, 0, 0.52) 100%
        );
    }

    .wallpaper-glow {
      position: absolute;

      width: 55vw;
      height: 55vw;

      min-width: 260px;
      min-height: 260px;

      top: 8%;
      left: 13%;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.035),
          transparent 68%
        );

      filter: blur(45px);

      opacity: 0.32;

      animation:
        glowFloat 24s ease-in-out
        infinite alternate;

      will-change: transform;
    }

    .grain {
      position: fixed;
      inset: 0;

      z-index: -10;

      pointer-events: none;

      opacity: 0.015;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.6'/%3E%3C/svg%3E");
    }

    @keyframes wallpaperFloat {
      0% {
        transform: scale(1.045)
          translate3d(-0.3%, -0.2%, 0);
      }

      100% {
        transform: scale(1.065)
          translate3d(0.7%, 0.5%, 0);
      }
    }

    @keyframes glowFloat {
      0% {
        transform:
          translate3d(-2%, -1%, 0)
          scale(0.98);
      }

      100% {
        transform:
          translate3d(4%, 3%, 0)
          scale(1.04);
      }
    }

    /* =========================================================
       MAIN CONTENT
       ========================================================= */

    .shell {
      width:
        min(
          1120px,
          calc(100% - 32px)
        );

      height: 100%;

      margin: 0 auto;

      padding:
        28px
        0
        20px;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

    /* =========================================================
       TOP BAR
       ========================================================= */

    .topbar {
      position: relative;

      flex: 0 0 auto;

      min-height: 38px;

      margin-bottom: 38px;
    }

    .brand {
      position: absolute;

      left: 0;
      top: 50%;

      transform:
        translateY(-50%);

      font-size: 12px;

      font-weight: 600;

      letter-spacing: 0.09em;

      color:
        rgba(
          255,
          255,
          255,
          0.72
        );

      text-shadow:
        0
        2px
        14px
        rgba(
          0,
          0,
          0,
          0.45
        );
    }

    /* =========================================================
       WEATHER
       ========================================================= */

    .weather-widget {
      position: absolute;

      right: 0;
      top: 0;

      display: inline-flex;

      align-items: center;

      gap: 8px;

      min-height: 36px;

      max-width: 220px;

      padding:
        6px
        10px;

      border:
        1px
        solid
        var(--glass-border);

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          rgba(
            255,
            255,
            255,
            0.075
          ),
          rgba(
            10,
            11,
            15,
            0.28
          ) 55%,
          rgba(
            255,
            255,
            255,
            0.035
          )
        );

      box-shadow:
        var(--shadow-soft),
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.06
        );

      backdrop-filter:
        blur(18px)
        saturate(125%);

      -webkit-backdrop-filter:
        blur(18px)
        saturate(125%);

      transition:
        transform 0.22s ease,
        border-color 0.22s ease,
        background 0.22s ease;
    }

    .weather-widget:hover {
      transform:
        translateY(-1px);

      border-color:
        rgba(
          255,
          255,
          255,
          0.17
        );

      background:
        linear-gradient(
          135deg,
          rgba(
            255,
            255,
            255,
            0.095
          ),
          rgba(
            10,
            11,
            15,
            0.32
          )
        );
    }

    .weather-mini-icon {
      width: 20px;

      flex:
        0
        0
        20px;

      font-size: 17px;

      line-height: 1;

      text-align: center;
    }

    .weather-mini-info {
      min-width: 0;
    }

    .weather-mini-top {
      display: flex;

      align-items: baseline;

      gap: 5px;

      line-height: 1;
    }

    .weather-mini-temp {
      font-size: 13px;

      font-weight: 600;

      letter-spacing: -0.035em;

      font-variant-numeric:
        tabular-nums;
    }

    .weather-mini-condition {
      max-width: 90px;

      font-size: 9px;

      color: var(--muted);

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .weather-mini-location {
      max-width: 150px;

      margin-top: 3px;

      font-size: 9px;

      color: var(--soft);

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      cursor: pointer;

      transition:
        color 0.2s ease;
    }

    .weather-mini-location:hover {
      color:
        rgba(
          255,
          255,
          255,
          0.78
        );
    }

    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      flex: 0 0 auto;

      text-align: center;

      margin:
        0
        auto
        35px;
    }

    .eyebrow {
      min-height: 20px;

      margin-bottom: 11px;

      font-size: 14px;

      color: var(--muted);

      text-shadow:
        0
        2px
        14px
        rgba(
          0,
          0,
          0,
          0.38
        );
    }

    .time {
      font-size:
        clamp(
          64px,
          12.5vw,
          144px
        );

      line-height:
        0.88;

      letter-spacing:
        -0.078em;

      font-weight: 600;

      font-variant-numeric:
        tabular-nums;

      margin-left:
        -0.078em;

      text-shadow:
        0
        6px
        36px
        rgba(
          0,
          0,
          0,
          0.35
        ),
        0
        0
        70px
        rgba(
          255,
          255,
          255,
          0.025
        );
    }

    .date {
      margin-top: 16px;

      color:
        rgba(
          242,
          244,
          248,
          0.67
        );

      font-size: 14px;

      letter-spacing:
        0.008em;

      text-shadow:
        0
        2px
        14px
        rgba(
          0,
          0,
          0,
          0.36
        );
    }

    /* =========================================================
       SEARCH
       ========================================================= */

    .search {
      position: relative;

      flex:
        0
        0
        auto;

      width:
        min(
          720px,
          100%
        );

      margin:
        0
        auto;

      isolation: isolate;
    }

    .search::before {
      content: "";

      position: absolute;

      inset: -1px;

      z-index: -1;

      border-radius: 20px;

      background:
        linear-gradient(
          110deg,
          rgba(255,255,255,0.10),
          rgba(255,255,255,0.025),
          rgba(255,255,255,0.10),
          rgba(255,255,255,0.025)
        );

      background-size: 250% 100%;

      opacity: 0.42;

      animation:
        searchBorder
        10s
        ease-in-out
        infinite;

      will-change:
        background-position;
    }

    .search::after {
      content: "";

      position: absolute;

      left: 12%;
      right: 12%;
      bottom: -11px;

      height: 18px;

      border-radius: 50%;

      background:
        rgba(
          0,
          0,
          0,
          0.38
        );

      filter:
        blur(14px);

      z-index: -2;
    }

    .search input {
      display: block;

      width: 100%;

      height: 60px;

      padding:
        0
        55px
        0
        21px;

      border:
        1px
        solid
        rgba(
          255,
          255,
          255,
          0.115
        );

      border-radius: 19px;

      outline: none;

      color: var(--text);

      background:
        linear-gradient(
          135deg,
          rgba(
            255,
            255,
            255,
            0.075
          ),
          rgba(
            9,
            10,
            14,
            0.34
          ) 52%,
          rgba(
            255,
            255,
            255,
            0.042
          )
        );

      box-shadow:
        0
        18px
        55px
        rgba(
          0,
          0,
          0,
          0.30
        ),
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.075
        ),
        inset
        0
        -1px
        0
        rgba(
          0,
          0,
          0,
          0.15
        );

      backdrop-filter:
        blur(24px)
        saturate(130%);

      -webkit-backdrop-filter:
        blur(24px)
        saturate(130%);

      transition:
        transform 0.28s
          cubic-bezier(
            0.2,
            0.8,
            0.2,
            1
          ),
        background 0.28s ease,
        border-color 0.28s ease,
        box-shadow 0.28s ease;
    }

    .search input::placeholder {
      color:
        rgba(
          230,
          233,
          238,
          0.44
        );

      transition:
        color 0.2s ease;
    }

    .search input:focus {
      transform:
        translateY(-2px)
        scale(1.005);

      border-color:
        rgba(
          255,
          255,
          255,
          0.19
        );

      background:
        linear-gradient(
          135deg,
          rgba(
            255,
            255,
            255,
            0.10
          ),
          rgba(
            9,
            10,
            14,
            0.39
          ) 52%,
          rgba(
            255,
            255,
            255,
            0.055
          )
        );

      box-shadow:
        0
        22px
        62px
        rgba(
          0,
          0,
          0,
          0.34
        ),
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.10
        ),
        0
        0
        35px
        rgba(
          255,
          255,
          255,
          0.045
        );
    }

    .search input:focus::placeholder {
      color:
        rgba(
          240,
          243,
          247,
          0.58
        );
    }

    .search-icon {
      position: absolute;

      right: 20px;
      top: 50%;

      width: 20px;
      height: 20px;

      transform:
        translateY(-50%);

      color:
        rgba(
          235,
          238,
          243,
          0.54
        );

      pointer-events: none;

      transition:
        transform 0.28s
          cubic-bezier(
            0.2,
            0.8,
            0.2,
            1
          ),
        color 0.25s ease;
    }

    .search:focus-within
    .search-icon {
      color:
        rgba(
          255,
          255,
          255,
          0.78
        );

      transform:
        translateY(-50%)
        scale(1.05);
    }

    @keyframes searchBorder {
      0% {
        background-position:
          0% 50%;
      }

      50% {
        background-position:
          100% 50%;
      }

      100% {
        background-position:
          0% 50%;
      }
    }

    /* =========================================================
       SHORTCUTS
       ========================================================= */

    .shortcuts {
      flex: 0 0 auto;

      width:
        min(
          800px,
          100%
        );

      margin:
        20px
        auto
        0;
    }

    .shortcut-grid {
      display: flex;

      justify-content: center;

      align-items: center;

      flex-wrap: wrap;

      gap: 10px;
    }

    .shortcut {
      position: relative;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      min-height: 44px;

      padding:
        0
        18px;

      border:
        1px
        solid
        rgba(
          255,
          255,
          255,
          0.095
        );

      border-radius:
        999px;

      background:
        linear-gradient(
          135deg,
          rgba(
            255,
            255,
            255,
            0.075
          ),
          rgba(
            11,
            12,
            16,
            0.32
          ) 52%,
          rgba(
            255,
            255,
            255,
            0.04
          )
        );

      color:
        rgba(
          241,
          243,
          246,
          0.92
        );

      box-shadow:
        var(--shadow-soft),
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.065
        ),
        inset
        0
        -1px
        0
        rgba(
          0,
          0,
          0,
          0.12
        );

      backdrop-filter:
        blur(18px)
        saturate(125%);

      -webkit-backdrop-filter:
        blur(18px)
        saturate(125%);

      overflow: hidden;

      transition:
        transform 0.2s
          cubic-bezier(
            0.2,
            0.8,
            0.2,
            1
          ),
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .shortcut::before {
      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          115deg,
          rgba(
            255,
            255,
            255,
            0.08
          ),
          transparent 45%,
          rgba(
            255,
            255,
            255,
            0.035
          )
        );

      opacity: 0;

      transition:
        opacity 0.2s ease;

      pointer-events: none;
    }

    .shortcut:hover {
      transform:
        translateY(-3px);

      border-color:
        rgba(
          255,
          255,
          255,
          0.18
        );

      background:
        linear-gradient(
          135deg,
          rgba(
            255,
            255,
            255,
            0.10
          ),
          rgba(
            12,
            13,
            18,
            0.37
          ) 52%,
          rgba(
            255,
            255,
            255,
            0.06
          )
        );

      box-shadow:
        0
        15px
        38px
        rgba(
          0,
          0,
          0,
          0.30
        ),
        inset
        0
        1px
        0
        rgba(
          255,
          255,
          255,
          0.08
        );
    }

    .shortcut:hover::before {
      opacity: 1;
    }

    .shortcut:active {
      transform:
        translateY(-1px)
        scale(0.975);
    }

    .shortcut svg {
      position: relative;

      z-index: 1;

      flex:
        0
        0
        auto;

      opacity: 0.84;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .shortcut:hover svg {
      transform:
        scale(1.06);

      opacity: 1;
    }

    .shortcut span {
      position: relative;

      z-index: 1;

      font-size: 11px;

      font-weight: 500;

      white-space: nowrap;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      flex:
        0
        0
        auto;

      margin-top: auto;

      padding-top: 12px;

      text-align: center;

      color:
        rgba(
          235,
          238,
          241,
          0.30
        );

      font-size: 9px;

      text-shadow:
        0
        2px
        10px
        rgba(
          0,
          0,
          0,
          0.4
        );
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {

      .shell {
        width:
          min(
            100% - 20px,
            1120px
          );

        padding:
          19px
          0
          16px;
      }

      .topbar {
        min-height: 36px;

        margin-bottom: 37px;
      }

      .weather-widget {
        top: -1px;

        max-width: 168px;
      }

      .hero {
        margin-bottom: 35px;
      }

      .time {
        font-size:
          clamp(
            57px,
            18vw,
            92px
          );
      }

      .date {
        font-size: 13px;

        margin-top: 14px;
      }

      .shortcuts {
        margin-top: 19px;
      }

      .shortcut {
        min-height: 42px;

        padding:
          0
          15px;
      }

      .shortcut span {
        font-size: 11px;
      }

      .wallpaper-glow {
        width: 75vw;
        height: 75vw;

        left: -15%;
        top: 5%;
      }
    }

    @media (max-width: 430px) {

      .weather-widget {
        max-width: 155px;

        padding:
          6px
          8px;
      }

      .weather-mini-condition {
        max-width: 65px;
      }

      .weather-mini-location {
        max-width: 110px;
      }

      .time {
        font-size:
          clamp(
            53px,
            18vw,
            82px
          );
      }

      .search input {
        height: 56px;
      }

      .shortcut-grid {
        gap: 8px;
      }

      .shortcut {
        padding:
          0
          14px;
      }
    }

    @media (max-height: 700px) {

      .shell {
        padding-top: 16px;
      }

      .topbar {
        margin-bottom: 26px;
      }

      .hero {
        margin-bottom: 25px;
      }

      .time {
        font-size:
          clamp(
            52px,
            13vw,
            90px
          );
      }

      .date {
        margin-top: 11px;
      }

      .shortcuts {
        margin-top: 14px;
      }

      footer {
        padding-top: 8px;
      }
    }

    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       APP
       ======================================================= -->

  <div class="app">

    <!-- =====================================================
         WALLPAPER
         ===================================================== -->

    <div
      class="wallpaper"
      aria-hidden="true"
    >

      <div
        class="wallpaper-image"
        id="wallpaperImage"
      ></div>

      <div class="wallpaper-overlay"></div>

      <div class="wallpaper-glow"></div>

      <div class="wallpaper-vignette"></div>

    </div>

    <div
      class="grain"
      aria-hidden="true"
    ></div>

    <!-- =====================================================
         PAGE
         ===================================================== -->

    <main class="shell">

      <!-- ===================================================
           TOP BAR
           =================================================== -->

      <header class="topbar">

        <div class="brand">
          HOME
        </div>

        <!-- Weather -->
        <div
          class="weather-widget"
          aria-label="Current weather"
        >

          <div
            class="weather-mini-icon"
            id="weatherIcon"
            aria-hidden="true"
          >
            —
          </div>

          <div class="weather-mini-info">

            <div class="weather-mini-top">

              <div
                class="weather-mini-temp"
                id="temperature"
              >
                --°
              </div>

              <div
                class="weather-mini-condition"
                id="condition"
              >
                Loading…
              </div>

            </div>

            <div
              class="weather-mini-location"
              id="location"
              title="Tap to refresh location"
            >
              Detecting location…
            </div>

          </div>

        </div>

      </header>

      <!-- ===================================================
           HERO
           =================================================== -->

      <section
        class="hero"
        aria-label="Welcome"
      >

        <div
          class="eyebrow"
          id="greeting"
        >
          Welcome.
        </div>

        <div
          class="time"
          id="time"
        >
          --:--
        </div>

        <div
          class="date"
          id="date"
        >
          Loading date…
        </div>

      </section>

      <!-- ===================================================
           SEARCH
           =================================================== -->

      <form
        class="search"
        id="searchForm"
        role="search"
      >

        <input
          id="searchInput"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search the web…"
          aria-label="Search the web"
        >

        <span
          class="search-icon"
          aria-hidden="true"
        >

          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >

            <circle
              cx="11"
              cy="11"
              r="6.7"
            ></circle>

            <path
              d="m16 16 5 5"
            ></path>

          </svg>

        </span>

      </form>

      <!-- ===================================================
           SHORTCUTS
           =================================================== -->

      <section
        class="shortcuts"
        aria-label="Shortcuts"
      >

        <nav class="shortcut-grid">

          <!-- YouTube -->
          <a
            class="shortcut"

            <svg

            >

              <rect

          <!-- YouTube Music -->
          <a
            class="shortcut"

            target="_blank"

          >

            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              aria-hidden="true"
            >

              <circle
                cx="12"

                r="9"
              ></circle>

              <path
                d="m10 8.5 5.5 3.5-5.5 3.5v-7Z"

              YouTube Music

          <!-- Discord -->
          <a
            class="shortcut"
            href="https://discord.com/app"
            target="_blank"
            rel="noopener noreferrer"
          >

            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              aria-hidden="true"
            >

              <path d="M19.4 6.1A16 16 0 0 0 15.5 5l-.5 1a14 14 0 0 0-6 0l-.5-1a16 16 0 0 0-3.9 1.1C3.4 9 3 12.7 3.2 16.4a16 16 0 0 0 4.9 2.5l1.2-1.7a9.8 9.8 0 0 1-1.9-.9l.5-.4a11.6 11.6 0 0 0 8.2 0l.5.4a9.8 9.8 0 0 1-1.9.9l1.2 1.7a16 16 0 0 0 4.9-2.5c.3-4.3-.6-8-1.4-10.3Z"></path>

              <circle
                cx="8.8"

              ></circle>

              <circle
                cx="15.2"

      <footer>
        Weather by Open-Meteo
      </footer>

    </main>

  </div>

  <script>
    "use strict";

    /* =========================================================
       RANDOM AESTHETIC WALLPAPER
       ========================================================= */

    const WALLPAPERS = [
      "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=2400&q=85",
      "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=2400&q=85",
      "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2400&q=85",
      "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=2400&q=85",
      "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=2400&q=85",
      "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=2400&q=85",
      "https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=2400&q=85",
      "https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=2400&q=85",
      "https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=2400&q=85"
    ];

    function setRandomWallpaper() {
      const wallpaper =
        document.getElementById(
          "wallpaperImage"
        );

      if (!wallpaper) {
        return;
      }

      const index =
        Math.floor(
          Math.random() *
          WALLPAPERS.length
        );

      wallpaper.style.backgroundImage =
        `url("${WALLPAPERS[index]}")`;
    }

    /*
      Set immediately instead of waiting for a preload.
      The first wallpaper in CSS also guarantees a background
      even before JavaScript runs.
    */
    setRandomWallpaper();

    /* =========================================================
       HELPER
       ========================================================= */

    const $ = (id) =>
      document.getElementById(id);

    /* =========================================================
       WEATHER CODES
       ========================================================= */

    const WEATHER_CODES = {
      0: ["Clear sky", "☀️"],
      1: ["Mainly clear", "🌤️"],
      2: ["Partly cloudy", "⛅"],
      3: ["Overcast", "☁️"],

      45: ["Fog", "🌫️"],
      48: ["Rime fog", "🌫️"],

      51: ["Light drizzle", "🌦️"],
      53: ["Drizzle", "🌦️"],
      55: ["Heavy drizzle", "🌧️"],

      56: ["Freezing drizzle", "🌧️"],
      57: ["Heavy freezing drizzle", "🌧️"],

      61: ["Light rain", "🌦️"],
      63: ["Rain", "🌧️"],
      65: ["Heavy rain", "🌧️"],

      66: ["Freezing rain", "🌧️"],
      67: ["Heavy freezing rain", "🌧️"],

      71: ["Light snow", "🌨️"],
      73: ["Snow", "❄️"],
      75: ["Heavy snow", "❄️"],
      77: ["Snow grains", "❄️"],

      80: ["Light showers", "🌦️"],
      81: ["Showers", "🌧️"],
      82: ["Heavy showers", "⛈️"],

      85: ["Snow showers", "🌨️"],
      86: ["Heavy snow showers", "🌨️"],

      95: ["Thunderstorm", "⛈️"],
      96: ["Thunderstorm + hail", "⛈️"],
      99: ["Thunderstorm + hail", "⛈️"]
    };

    /* =========================================================
       GREETINGS
       ========================================================= */

    const GREETINGS = {
      night: [
        "Still up?",
        "Late-night mode.",
        "Good night.",
        "The world is quiet.",
        "Burning the midnight oil?",
        "One more thing before bed?"
      ],

      earlyMorning: [
        "Good morning.",
        "Morning.",
        "Rise and shine.",
        "A fresh start.",
        "New day, new start.",
        "Good morning, Zynx."
      ],

      morning: [
        "Good morning.",
        "Hope your morning is going well.",
        "Morning, Zynx.",
        "Ready for the day?",
        "Hope you're having a good start.",
        "A good morning to you."
      ],

      midday: [
        "Almost noon.",
        "Good afternoon.",
        "Midday already.",
        "Halfway through the day.",
        "How's your day going?",
        "Hope the day is going well."
      ],

      afternoon: [
        "Good afternoon.",
        "How's your afternoon?",
        "Hope your day is going well.",
        "Afternoon.",
        "Still plenty of day left.",
        "Hope you're having a good one."
      ],

      evening: [
        "Good evening.",
        "Evening.",
        "Hope you had a good day.",
        "A quiet evening.",
        "Time to slow down.",
        "Good to see you."
      ],

      lateEvening: [
        "Good evening.",
        "Winding down?",
        "Late evening.",
        "Still going strong?",
        "A calm night ahead.",
        "Almost time to call it a day."
      ]
    };

    function getGreeting(hour) {
      if (hour < 5) {
        return GREETINGS.night;
      }

      if (hour < 9) {
        return GREETINGS.earlyMorning;
      }

      if (hour < 12) {
        return GREETINGS.morning;
      }

      if (hour < 14) {
        return GREETINGS.midday;
      }

      if (hour < 18) {
        return GREETINGS.afternoon;
      }

      if (hour < 21) {
        return GREETINGS.evening;
      }

      return GREETINGS.lateEvening;
    }

    /* =========================================================
       CLOCK
       ========================================================= */

    function updateClock() {
      const now =
        new Date();

      const timeString =
        now.toLocaleTimeString(
          [],
          {
            hour: "numeric",
            minute: "2-digit",
            hour12: true
          }
        );

      const dateString =
        now.toLocaleDateString(
          [],
          {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        );

      const greetings =
        getGreeting(
          now.getHours()
        );

      const greetingIndex =
        (
          now.getDate() +
          now.getMonth() +
          now.getDay()
        ) % greetings.length;

      $("time").textContent =
        timeString;

      $("date").textContent =
        dateString;

      $("greeting").textContent =
        greetings[greetingIndex];

      document.title =
        `${timeString} · Home`;
    }

    updateClock();

    setInterval(
      updateClock,
      1000
    );

    /* =========================================================
       SEARCH
       ========================================================= */

    $("searchForm")
      .addEventListener(
        "submit",
        (event) => {
          event.preventDefault();

          const query =
            $("searchInput")
              .value
              .trim();

          if (!query) {
            return;
          }

          window.location.href =
            "https://www.google.com/search?q=" +
            encodeURIComponent(
              query
            );
        }
      );

    /* =========================================================
       REVERSE GEOCODING
       ========================================================= */

    async function reverseGeocode(
      latitude,
      longitude
    ) {
      const url =
        "https://api.bigdatacloud.net/data/reverse-geocode-client" +
        `?latitude=${encodeURIComponent(latitude)}` +
        `&longitude=${encodeURIComponent(longitude)}` +
        "&localityLanguage=en";

      try {
        const response =
          await fetch(url);

        if (!response.ok) {
          throw new Error(
            "Reverse geocoding failed."
          );
        }

        const data =
          await response.json();

        const name =
          data?.city ||
          data?.locality ||
          data?.principalSubdivision ||
          null;

        if (!name) {
          return null;
        }

        return {
          name,

          country:
            data?.countryName || ""
        };
      } catch {
        return null;
      }
    }

    /* =========================================================
       WEATHER API
       ========================================================= */

    async function fetchWeather(
      latitude,
      longitude
    ) {
      const params =
        new URLSearchParams({
          latitude,
          longitude,

          current:
            "temperature_2m," +
            "relative_humidity_2m," +
            "apparent_temperature," +
            "weather_code," +
            "wind_speed_10m",

          timezone:
            "auto",

          temperature_unit:
            "celsius",

          wind_speed_unit:
            "kmh"
        });

      const response =
        await fetch(
          "https://api.open-meteo.com/v1/forecast?" +
          params.toString()
        );

      if (!response.ok) {
        throw new Error(
          "Weather request failed."
        );
      }

      return response.json();
    }

    /* =========================================================
       RENDER WEATHER
       ========================================================= */

    function renderWeather(
      data,
      place
    ) {
      if (
        !data ||
        !data.current
      ) {
        throw new Error(
          "Invalid weather data."
        );
      }

      const current =
        data.current;

      const code =
        Number(
          current.weather_code
        );

      const info =
        WEATHER_CODES[code] ||
        ["Weather", "•"];

      $("weatherIcon")
        .textContent =
          info[1];

      $("temperature")
        .textContent =
          `${Math.round(
            Number(
              current.temperature_2m
            )
          )}°`;

      $("condition")
        .textContent =
          info[0];

      $("location")
        .textContent =
          place
            ? `${place.name}${
                place.country
                  ? `, ${place.country}`
                  : ""
              }`
            : "Your location";
    }

    /* =========================================================
       WEATHER LOADING
       ========================================================= */

    async function loadWeatherFromCoordinates(
      latitude,
      longitude,
      knownPlace = null
    ) {
      const [
        weather,
        place
      ] =
        await Promise.all([
          fetchWeather(
            latitude,
            longitude
          ),

          knownPlace
            ? Promise.resolve(
                knownPlace
              )
            : reverseGeocode(
                latitude,
                longitude
              )
        ]);

      renderWeather(
        weather,
        place
      );

      try {
        localStorage.setItem(
          "homeLocation",
          JSON.stringify({
            latitude,
            longitude,
            place
          })
        );
      } catch {
        // Storage is optional.
      }
    }

    async function loadWeather() {
      if (
        !("geolocation" in navigator)
      ) {
        throw new Error(
          "Geolocation unavailable."
        );
      }

      const position =
        await new Promise(
          (
            resolve,
            reject
          ) => {
            navigator.geolocation
              .getCurrentPosition(
                resolve,
                reject,
                {
                  enableHighAccuracy:
                    false,

                  timeout:
                    10000,

                  maximumAge:
                    900000
                }
              );
          }
        );

      const latitude =
        Number(
          position.coords.latitude
        );

      const longitude =
        Number(
          position.coords.longitude
        );

      await loadWeatherFromCoordinates(
        latitude,
        longitude
      );
    }

    async function loadSavedWeather() {
      let saved = null;

      try {
        saved =
          localStorage.getItem(
            "homeLocation"
          );
      } catch {
        return false;
      }

      if (!saved) {
        return false;
      }

      try {
        const location =
          JSON.parse(saved);

        if (
          typeof location?.latitude !==
            "number" ||
          typeof location?.longitude !==
            "number"
        ) {
          return false;
        }

        await loadWeatherFromCoordinates(
          location.latitude,
          location.longitude,
          location.place || null
        );

        return true;
      } catch {
        return false;
      }
    }

    async function startWeather() {
      const restored =
        await loadSavedWeather();

      if (restored) {
        return;
      }

      try {
        await loadWeather();
      } catch {
        $("location")
          .textContent =
            "Tap to enable location";

        $("condition")
          .textContent =
            "Location required";
      }
    }

    /* =========================================================
       WEATHER REFRESH
       ========================================================= */

    $("location")
      .addEventListener(
        "click",
        async () => {
          const previous =
            $("location")
              .textContent;

          $("location")
            .textContent =
              "Refreshing…";

          try {
            await loadWeather();
          } catch {
            $("location")
              .textContent =
                previous ||
                "Location unavailable";
          }
        }
      );

    startWeather();
  </script>

</body>
